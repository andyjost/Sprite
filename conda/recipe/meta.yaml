# Conda recipe for Sprite (linux-64).  A scaffold: not published.  See
# ../README.md for the layout of the package, the second recipe that
# provides the Curry front end, and the open questions.
#
# Keep the version equal to the VERSION file at the repository root.
{% set version = "0.9" %}

package:
  name: sprite
  version: {{ version }}

source:
  # The repository, two levels up.  The source must carry the pybind11
  # submodule under extern/pybind11.  A release tarball from GitHub does not;
  # build from a clone, or add pybind11 to the host requirements and point
  # the include path at it (see ../README.md).
  path: ../..

build:
  number: 0
  skip: true  # [not linux64]
  # Sprite's tree lives under opt/sprite (see build.sh).  libcyrt.so is in
  # opt/sprite/lib, so the run path of the extension module names that
  # directory as well as lib.
  rpaths:
    - lib
    - opt/sprite/lib
  # The compiled library modules under opt/sprite/curry name the build
  # prefix: the shared objects name the modules they import by absolute
  # path (their NEEDED entries; see curry.backends.cxx.toolchain.Cpp2So),
  # and the generated Python and C++ name the Curry source.  conda-build
  # records them in info/has_prefix, and conda writes the prefix of the
  # environment into them at install time.  The binary case is the default
  # on Linux; it is spelled out because the package depends on it.
  detect_binary_files_with_prefix: true

requirements:
  build:
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
    - make
  host:
    - python 3.14.*
    # Header-only use: boost/integer, boost/io, boost/pool,
    # boost/preprocessor, and boost/utility (grep src/cyrt for boost/).
    - libboost-headers
    # configure checks the front end, and make install runs it over the
    # Curry library so that the package holds the FlatCurry of the library.
    - curry-frontend 2.0.0.*
  run:
    - python 3.14.*
    # The front end writes FlatCurry; Sprite translates it to ICurry.  Its
    # own run dependency is gmp (libgmp).  The ICurry oracle depends on this
    # exact front end, so the pin is exact.
    - curry-frontend 2.0.0.*
    # The C++ backend compiles the code it generates at run time against the
    # installed headers, which include Boost.  The metapackage brings the
    # compiler of the platform; tools/cxx resolves it at run time (see
    # build.sh).  conda_build_config.yaml pins the compiler of the build to
    # the same major version.
    - cxx-compiler
    - libboost-headers

test:
  # The commands with a Curry program are block scalars: a plain YAML scalar
  # cannot hold the ": " of a type signature.  The library modules come
  # compiled in the package; each test compiles the one module it writes.
  commands:
    - sprite-exec --help
    - sprite-make --help
    - python -c "import curry; print(curry.config.prefix())"
    # The Python backend, through the launcher and through the module.
    - >-
      d=$(mktemp -d) && cd "$d" &&
      printf 'main :: Int\nmain = 6 * 7\n' > Smoke.curry &&
      sprite-exec Smoke.curry | grep -x 42
    - >-
      d=$(mktemp -d) && cd "$d" &&
      printf 'main :: Int\nmain = 6 * 7\n' > Smoke.curry &&
      python -m curry Smoke.curry | grep -x 42
    # The C++ backend compiles the program with the compiler of the
    # environment (cxx-compiler), the precompiled header of the runtime
    # first.  The shared object and its ABI stamp beside the program show
    # that the C++ backend ran; the Python backend writes neither.
    - >-
      d=$(mktemp -d) && cd "$d" &&
      printf 'main :: Int\nmain = 6 * 7\n' > Smoke.curry &&
      SPRITE_INTERPRETER_FLAGS=backend:cxx sprite-exec Smoke.curry | grep -x 42 &&
      test -s .curry/sprite-pakcs-3.4.1/Smoke.so &&
      test -s .curry/sprite-pakcs-3.4.1/Smoke.so.abi
    - >-
      d=$(mktemp -d) && cd "$d" &&
      printf 'main :: Int\nmain = 6 * 7\n' > Smoke.curry &&
      SPRITE_INTERPRETER_FLAGS=backend:cxx python -m curry Smoke.curry | grep -x 42 &&
      test -s .curry/sprite-pakcs-3.4.1/Smoke.so &&
      test -s .curry/sprite-pakcs-3.4.1/Smoke.so.abi

about:
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - curry/lib/LICENSE
    - curry/lib/NOTICE
    - extern/pybind11/LICENSE
  home: https://github.com/andyjost/Sprite
  summary: Sprite, a compiler and runtime for the Curry language
  description: |
    Sprite compiles Curry to Python or C++ behind a Python API.  The package
    installs the Sprite tree under opt/sprite, the launchers sprite-exec and
    sprite-make under bin, and makes the Python package curry importable.
    The Curry front end of PAKCS comes from the package curry-frontend.
  doc_url: https://andyjost.github.io/Sprite/
  dev_url: https://github.com/andyjost/Sprite
