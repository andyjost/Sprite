# Conda recipe for Sprite (linux-64).  A scaffold: not published.  See
# ../README.md for the layout of the package, the second recipe that
# provides the Curry front end, and the open questions.
#
# The version is the VERSION file at the repository root, read at render
# time (open question 10 of ../README.md).
{% set version = load_file_regex(load_file="../../VERSION", regex_pattern="(\S+)", from_recipe_dir=True).group(1) %}

{% set current_tools = environ.get("SPRITE_FRONTEND_VERSION", "2.0.0") == "3.1.0" %}
{% set pakcs_version = "3.10.0" if current_tools else "3.4.1" %}

package:
  name: currylang
  version: {{ version }}

source:
  # The repository, two levels up.  The source must carry the pybind11
  # submodule under extern/pybind11.  A release tarball from GitHub does not;
  # build from a clone, or add pybind11 to the host requirements and point
  # the include path at it (see ../README.md).
  path: ../..

build:
  number: 0
  skip: true  # [not linux64]
  # Sprite's tree lives under opt/sprite (see build.sh).  libcurryrt.so is in
  # opt/sprite/lib, so the run path of the extension module names that
  # directory as well as lib.
  rpaths:
    - lib
    - opt/sprite/lib
  # Of the files under opt/sprite/curry, one kind names the build prefix:
  # the ABI stamp beside each compiled library module (.so.abi) names the
  # real path of the installation as text on its second line.  conda-build
  # records a text file that holds the prefix in info/has_prefix by
  # itself, and conda writes the prefix of the environment into it at
  # install time, so the shipped objects stay current ("Relocation" in
  # ../README.md).  The objects themselves hold no path since format 13 of
  # the generated code: they name the modules they import by SONAME
  # (curry.backends.cxx.toolchain.Cpp2So), so no binary file of the package
  # holds the prefix.  The generated Python and C++ files name their
  # sources relative to the installation (step 9 of build.sh), so no other
  # text file holds it; a test below checks the .py and .cpp files.  The
  # detection of binary files is the default on Linux; it stays spelled
  # out so that a binary file that holds the prefix again shows up in
  # info/has_prefix instead of breaking silently.
  detect_binary_files_with_prefix: true

requirements:
  build:
    - cmake >=3.24
    - ninja
    - make
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
    - {{ stdlib('c') }}
  host:
    - python {{ python }}.*,>=3.11.4,<3.16
    # CMake checks the front end, and make install runs it over the
    # Curry library so that the package holds the FlatCurry of the library.
{% if current_tools %}
    - curry-frontend 3.1.0.*
{% else %}
    - curry-frontend 2.0.0.*
{% endif %}
  run:
    - python >=3.11.4,<3.16
    # The front end writes FlatCurry; Sprite translates it to ICurry.  Its
    # own run dependency is gmp (libgmp).  The ICurry oracle depends on this
    # exact front end, so the pin is exact.
{% if current_tools %}
    - curry-frontend 3.1.0.*
{% else %}
    - curry-frontend 2.0.0.*
{% endif %}
    # The C++ backend compiles the code it generates at run time against the
    # installed headers, which need the C++17 standard library alone (no
    # Boost).  The metapackage brings the compiler of the platform;
    # tools/cxx resolves it at run time (see build.sh).
    # conda_build_config.yaml pins the compiler of the build to the same
    # major version.
    - cxx-compiler

test:
  # The commands with a Curry program are block scalars: a plain YAML scalar
  # cannot hold the ": " of a type signature.  The library modules come
  # compiled in the package; each test compiles the one module it writes.
  commands:
    - sprite-exec --help
    - sprite-make --help
    - python -c "import curry; print(curry.config.prefix())"
    # The C++ backend, the default, through the launcher and through the
    # module.  Under its tiered mode a short program runs interpreted and
    # its background compile is cancelled at exit, so no object is checked.
    - >-
      d=$(mktemp -d) && cd "$d" &&
      printf 'main :: Int\nmain = 6 * 7\n' > Smoke.curry &&
      sprite-exec Smoke.curry | grep -x 42
    - >-
      d=$(mktemp -d) && cd "$d" &&
      printf 'main :: Int\nmain = 6 * 7\n' > Smoke.curry &&
      python -m curry Smoke.curry | grep -x 42
    # The compiler of the environment (cxx-compiler): sprite-make compiles
    # the program, the precompiled header of the runtime first.  The shared
    # object and its ABI stamp beside the program show that the compile
    # ran, and the program then runs from the object.  The header went to
    # the cache directory of the user, not into the package: the tree lies
    # in a conda prefix (config.cxx_pch_root).
    - >-
      d=$(mktemp -d) && cd "$d" &&
      printf 'main :: Int\nmain = 6 * 7\n' > Smoke.curry &&
      sprite-make --so Smoke.curry &&
{% if current_tools %}
      test -s .curry/sprite-pakcs-3.10.0/Smoke.so &&
      test -s .curry/sprite-pakcs-3.10.0/Smoke.so.abi &&
{% else %}
      test -s .curry/sprite-pakcs-3.4.1/Smoke.so &&
      test -s .curry/sprite-pakcs-3.4.1/Smoke.so.abi &&
{% endif %}
      sprite-exec Smoke.curry | grep -x 42 &&
      test ! -e "$PREFIX/opt/sprite/include/curryrt/curryrt.hpp.gch" &&
      test -d "${XDG_CACHE_HOME:-$HOME/.cache}/sprite/pch"
    # The generated files of the library name their sources relative to
    # the installation, so no file of the package but the shared objects
    # holds the prefix (see "Relocation" in ../README.md), and the module
    # objects resolve the names against the installation.
    - >-
      test -z "$(grep -rlF "$PREFIX" "$PREFIX/opt/sprite/curry" --include='*.py' --include='*.cpp')"
    - >-
      python -c "import curry, os; from curry.lib import Prelude;
      assert Prelude.__file__ == os.path.join(curry.config.prefix(), 'curry', 'Prelude.curry'), Prelude.__file__;
      print(curry.typeof(Prelude.length))" | grep -x '\[a\] -> Int'
about:
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - curry/lib/LICENSE
    - curry/lib/NOTICE
    - extern/pybind11/LICENSE
  home: https://github.com/andyjost/Sprite
  summary: Sprite, a compiler and runtime for the Curry language
  description: |
    Sprite compiles Curry to Python or C++ behind a Python API.  The package
    installs the Sprite tree under opt/sprite, the launchers sprite-exec and
    sprite-make under bin, and makes the Python package curry importable.
    The Curry front end of PAKCS comes from the package curry-frontend.
  doc_url: https://andyjost.github.io/Sprite/
  dev_url: https://github.com/andyjost/Sprite
