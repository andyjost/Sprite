name: Windows spike

# The runtime and its Python bindings compiled on Windows, for the report of
# what the port is (the portability memo of 2026-10-18, step 4; the owner's
# go of 2026-10-29).  Two compilers: clang-cl, which knows the GNU builtins
# of the runtime, and cl.  The job builds the two targets alone with the
# Visual Studio generator, which finds the toolchain without a developer
# prompt, lets every translation unit report, and uploads the logs.  No
# front end: the configure takes the pinned library products.

'on':
  # Every push of the spike branches runs it: the line endings of the
  # checkout and the attributes matter as much as the sources.
  push:
    branches: [wt/windows, 'wt/windows-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: runtime (${{ matrix.name }})
    runs-on: windows-2025
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clang-cl
            cc: clang-cl
          - name: msvc
            cc: cl
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Tools
        run: |
          set -euxo pipefail
          python -m pip install --quiet cmake ninja scikit-build-core numpy
          cmake --version
          ninja --version
          python -c "import sys, platform; print(sys.version); print(platform.machine())"
          "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property installationPath || true
          clang-cl --version || echo "no clang-cl on PATH"
      # The developer environment of Visual Studio (INCLUDE, LIB, PATH) comes
      # from vcvars64.bat, which only cmd can call; Ninja then builds with the
      # compiler of the matrix and keeps going past errors, so one run
      # reports every translation unit.
      - name: Configure and build in the developer environment
        id: build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          echo Visual Studio: %VSPATH%
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set "CC=${{ matrix.cc }}"
          set "CXX=${{ matrix.cc }}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE=%pythonLocation%\python.exe -DWITH_PAKCS= -DWITH_CURRY_FRONTEND= -DWITH_ICURRY= > configure.log 2>&1
          set "CONFIGURE_STATUS=%errorlevel%"
          type configure.log
          if not "%CONFIGURE_STATUS%"=="0" exit /b %CONFIGURE_STATUS%
          cmake --build build --target curryrt _curryrtbindings --parallel -- -k 0 > build.log 2>&1
          set "BUILD_STATUS=%errorlevel%"
          type build.log
          exit /b %BUILD_STATUS%
      - name: Errors by file and by kind
        if: always()
        run: |
          set -uo pipefail
          [ -f build.log ] || { echo "no build log (the configure failed)"; exit 0; }
          echo "== errors by file:"
          grep -oE '[A-Za-z0-9_./\\-]+\.(cpp|hpp|h)\([0-9]+(,[0-9]+)?\): (fatal )?error|[A-Za-z0-9_./\\-]+\.(cpp|hpp|h):[0-9]+:[0-9]+: (fatal )?error' build.log \
            | sed -E 's/(\([0-9,]+\)|:[0-9]+:[0-9]+): (fatal )?error//' | sort | uniq -c | sort -rn | head -60
          echo "== error kinds:"
          grep -oE 'error C[0-9]+: [^\[]{0,70}|error: [^\[]{0,70}' build.log | sort | uniq -c | sort -rn | head -50
          echo "== totals:"
          grep -cE '(: |\): )(fatal )?error' build.log || true
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.name }}-${{ github.run_attempt }}
          path: |
            configure.log
            build.log
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeCache.txt
          if-no-files-found: warn
