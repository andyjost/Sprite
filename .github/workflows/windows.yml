name: Windows

# The runtime, its Python bindings and the staged package built on Windows
# (the portability memo of 2026-10-18, step 4; the owner's go of 2026-10-29).
# Two compilers: clang-cl, the compiler of the port, which knows the GNU
# builtins of the runtime, and cl, experimental.  The job configures in the
# developer environment of Visual Studio, builds every target with Ninja
# past the first error so one run reports every translation unit, runs the
# interpreter, generated DLLs and C++ JIT, and uploads the logs. The
# library uses its pinned products; curry-frontend compiles test sources.

'on':
  # Every push of master and of the Windows branches runs it: the line
  # endings of the checkout and the attributes matter as much as the
  # sources.  The clang-cl job is the port's gate; cl is experimental.
  push:
    branches: [master, wt/windows, 'wt/windows-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: runtime (${{ matrix.name }})
    runs-on: windows-2025
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clang-cl
            cc: clang-cl
            experimental: false
          - name: msvc
            cc: cl
            experimental: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Tools
        run: |
          set -euxo pipefail
          python -m pip install --quiet cmake ninja scikit-build-core numpy llvmlite curry-frontend==3.1.0.post2
          cmake --version
          clang++ --version || echo "no clang++ on PATH"
          ninja --version
          python -c "import sys, platform; print(sys.version); print(platform.machine())"
          "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property installationPath || true
          clang-cl --version || echo "no clang-cl on PATH"
      # The developer environment of Visual Studio (INCLUDE, LIB, PATH) comes
      # from vcvars64.bat, which only cmd can call; Ninja then builds with the
      # compiler of the matrix and keeps going past errors, so one run
      # reports every translation unit.
      - name: Configure and build in the developer environment
        id: build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          echo Visual Studio: %VSPATH%
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set "CC=${{ matrix.cc }}"
          set "CXX=${{ matrix.cc }}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE=%pythonLocation%\python.exe -DWITH_PAKCS= -DWITH_CURRY_FRONTEND= -DWITH_ICURRY= -DWITH_CLANG=clang++ > configure.log 2>&1
          set "CONFIGURE_STATUS=%errorlevel%"
          type configure.log
          if not "%CONFIGURE_STATUS%"=="0" exit /b %CONFIGURE_STATUS%
          rem Check runtime data exports before currylib links the Prelude.
          cmake --build build --target curryrt --parallel -- -k 0 > runtime-build.log 2>&1
          set "RUNTIME_STATUS=%errorlevel%"
          type runtime-build.log
          if not "%RUNTIME_STATUS%"=="0" exit /b %RUNTIME_STATUS%
          dumpbin /nologo /EXPORTS build\stage\lib\libcurryrt.dll > runtime-exports.log 2>&1
          set "EXPORT_STATUS=%errorlevel%"
          type runtime-exports.log
          if not "%EXPORT_STATUS%"=="0" exit /b %EXPORT_STATUS%
          python -c "from pathlib import Path; names = Path('runtime-exports.log').read_text().split(); required = ['CyD7Prelude3Int', 'CyD7Prelude4Bool', 'CyD7Prelude4Char', 'CyD7Prelude5Float', 'CyD7Prelude2IO', 'CyD7Prelude4_Y_y', 'CyD7Prelude4_K_k', 'CyD7Prelude6_Y_m_y']; missing = [name for name in required if name not in names]; print('Required runtime data exports:', ', '.join(required)); assert not missing, 'Missing runtime data exports: ' + ', '.join(missing)" || exit /b 1
          cmake --build build --parallel -- -k 0 > build.log 2>&1
          set "BUILD_STATUS=%errorlevel%"
          type build.log
          exit /b %BUILD_STATUS%
      # The interpreter over the staged tree: the extension loads the runtime
      # library from lib/, the Prelude comes from its pinned ICurry.
      - name: Smoke test of the interpreter
        if: always()
        env:
          SPRITE_HOME: ${{ github.workspace }}\build\stage
          PYTHONPATH: ${{ github.workspace }}\build\stage\python
        run: |
          set -uxo pipefail
          ls build/stage/lib build/stage/python/curry/backends/cxx/curryrtbindings || true
          python -c "import curry; from curry.interpreter import flags; d = flags.get_default_flags(); print(curry.config.curryrt_lib_name(), d['interpret'] if isinstance(d, dict) else d)"
          python -c "import curry; from curry.lib import Prelude; print(curry.eval(Prelude.reverse([1, 2, 3])).one())"
          python -c "import curry; from curry.lib import Prelude; print(sorted(curry.eval(Prelude['?'](1, 2))))"
      # The JIT on Windows: the bitcode of the helpers from the clang of the
      # runner, llvmlite's LLJIT, the hot tier beside an evaluation long
      # enough to cross the threshold.
      - name: Smoke test of the JIT
        if: always()
        env:
          SPRITE_HOME: ${{ github.workspace }}\build\stage
          PYTHONPATH: ${{ github.workspace }}\build\stage\python
          SPRITE_INTERPRETER_FLAGS: interpret:all,jit:hot,jit_backend:llvm
          SPRITE_JIT_THRESHOLD: '20'
        run: |
          set -uxo pipefail
          ls -l build/stage/lib/curryrt-helpers.bc
          python - <<'EOF'
          import curry, logging, threading, time
          logging.basicConfig(level=logging.WARNING)
          threading.excepthook = lambda args: print('thread error:', args.exc_type.__name__, args.exc_value)
          from curry.lib import Prelude
          from curry.backends.cxx import curryrtbindings, llvmjit, materialize
          print('available:', llvmjit.available(), 'flag:', curry.flags['jit'], 'threshold:', materialize.jit_threshold())
          print('threads:', [t.name for t in threading.enumerate()], 'runtime threshold:', curryrtbindings.icurry_hot_threshold())
          import llvmlite.binding as llvm
          print('triples: default', llvm.get_default_triple(), 'process', llvm.get_process_triple(), 'bitcode', llvmjit._jit.triple, 'layout', llvmjit._jit.data_layout)
          t0 = time.perf_counter()
          # A linear scan of a lazy list: many steps, a bounded depth (the
          # length of a list two million long overflows the worker's stack
          # of 1 GiB on Windows, where the frames are larger).
          print(curry.eval(Prelude.elem(999999, Prelude.enumFromTo(1, 1000000))).one())
          print('eval %.2f s' % (time.perf_counter() - t0))
          deadline = time.monotonic() + 60
          while llvmjit.statistics()['hot'] == 0 and time.monotonic() < deadline:
            time.sleep(0.05)
          print(llvmjit.statistics())
          print('threads:', [t.name for t in threading.enumerate()], 'runtime threshold:', curryrtbindings.icurry_hot_threshold(), 'hot list:', len(curryrtbindings.icurry_take_hot()))
          print(curry.eval(Prelude.elem(999999, Prelude.enumFromTo(1, 1000000))).one())
          assert llvmjit.statistics()['hot'] > 0, 'the hot tier compiled nothing'
          EOF
      - name: Generated DLLs and C++ compiler tiers
        shell: cmd
        env:
          SPRITE_HOME: ${{ github.workspace }}\build\stage
          PYTHONPATH: ${{ github.workspace }}\build\stage\python;${{ github.workspace }}\tests\lib
          SPRITE_INTERPRETER_FLAGS: interpret:new,jit:off
          SPRITE_ROTATION: steps:65536
          SPRITE_PRODUCT_CACHE: ''
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          python -c "import curry; print(curry.flags['interpret']); assert curry.flags['interpret'] == 'new'" || exit /b 1
          cd tests
          python -m unittest -v unit_windows_aot unit_cxx_tiered.TestSwap.test_edited_module_swaps_to_its_new_code unit_make.TestMake.test_sprite_make_so unit_cxx_interp.TestFirstUse.test_compiled_on_first_use unit_cxx_interp.TestFirstUse.test_pending_import_compiles_first unit_loadsave.TestRoundTrip.test_round_trip unit_loadsave.TestRoundTrip.test_cold_cache_hot_cxx unit_loadsave.TestRoundTrip.test_all_refuses_the_swap_with_a_reason unit_loadsave.TestSavedProgram unit_loadsave.TestPublicObjects.test_saved_constrained_program_prints_the_defaulted_goal unit_loadsave.TestPublicObjects.test_nonstandard_suffix_maps_the_requested_file || exit /b 1
          cd ..\examples\04-static-compile
          python -c "import subprocess, sys; from pathlib import Path; result = subprocess.run([sys.executable, 'go.py'], capture_output=True, text=True); print(result.stdout, end=''); print(result.stderr, end='', file=sys.stderr); assert result.returncode == 0, result.returncode; assert result.stdout.splitlines() == Path('expected.out').read_text().splitlines()[1:]" || exit /b 1
      - name: Errors by file and by kind
        if: always()
        run: |
          set -uo pipefail
          [ -f build.log ] || { echo "no build log (the configure failed)"; exit 0; }
          echo "== errors by file:"
          { grep -oE '[A-Za-z0-9_./\\-]+\.(cpp|hpp|h)\([0-9]+(,[0-9]+)?\): (fatal )?error|[A-Za-z0-9_./\\-]+\.(cpp|hpp|h):[0-9]+:[0-9]+: (fatal )?error' build.log || true; } \
            | sed -E 's/(\([0-9,]+\)|:[0-9]+:[0-9]+): (fatal )?error//' | sort | uniq -c | sort -rn | head -60
          echo "== error kinds:"
          { grep -oE 'error C[0-9]+: [^\[]{0,70}|error: [^\[]{0,70}' build.log || true; } | sort | uniq -c | sort -rn | head -50
          echo "== link errors:"
          { grep -E 'lld-link: error|error LNK[0-9]+|LINK : fatal' build.log || true; } | sed -E 's/>>> referenced.*//' | sort | uniq -c | sort -rn | head -40
          echo "== failed steps of ninja:"
          { grep -E '^FAILED:' build.log || true; } | head -20
          echo "== totals:"
          grep -cE '(: |\): )(fatal )?error' build.log || true
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.name }}-${{ github.run_attempt }}
          path: |
            configure.log
            runtime-build.log
            runtime-exports.log
            build.log
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeCache.txt
          if-no-files-found: warn
