name: Windows

# The runtime, its Python bindings and the staged package built on Windows
# (the portability memo of 2026-10-18, step 4; the owner's go of 2026-10-29).
# Two compilers: clang-cl, the compiler of the port, which knows the GNU
# builtins of the runtime, and cl, experimental.  The job configures in the
# developer environment of Visual Studio, builds every target with Ninja
# past the first error so one run reports every translation unit, runs the
# interpreter on a Prelude function, and uploads the logs.  No front end:
# the configure takes the pinned library products, and no compile of
# generated code: every module runs interpreted (interpret 'all').

'on':
  # Every push of master and of the Windows branches runs it: the line
  # endings of the checkout and the attributes matter as much as the
  # sources.  The clang-cl job is the port's gate; cl is experimental.
  push:
    branches: [master, wt/windows, 'wt/windows-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: runtime (${{ matrix.name }})
    runs-on: windows-2025
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clang-cl
            cc: clang-cl
            experimental: false
          - name: msvc
            cc: cl
            experimental: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Tools
        run: |
          set -euxo pipefail
          python -m pip install --quiet cmake ninja scikit-build-core numpy llvmlite
          cmake --version
          clang++ --version || echo "no clang++ on PATH"
          ninja --version
          python -c "import sys, platform; print(sys.version); print(platform.machine())"
          "/c/Program Files (x86)/Microsoft Visual Studio/Installer/vswhere.exe" -latest -products '*' -property installationPath || true
          clang-cl --version || echo "no clang-cl on PATH"
      # The developer environment of Visual Studio (INCLUDE, LIB, PATH) comes
      # from vcvars64.bat, which only cmd can call; Ninja then builds with the
      # compiler of the matrix and keeps going past errors, so one run
      # reports every translation unit.
      - name: Configure and build in the developer environment
        id: build
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSPATH=%%i"
          echo Visual Studio: %VSPATH%
          call "%VSPATH%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          set "CC=${{ matrix.cc }}"
          set "CXX=${{ matrix.cc }}"
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython_EXECUTABLE=%pythonLocation%\python.exe -DWITH_PAKCS= -DWITH_CURRY_FRONTEND= -DWITH_ICURRY= -DWITH_CLANG=clang++ > configure.log 2>&1
          set "CONFIGURE_STATUS=%errorlevel%"
          type configure.log
          if not "%CONFIGURE_STATUS%"=="0" exit /b %CONFIGURE_STATUS%
          cmake --build build --parallel -- -k 0 > build.log 2>&1
          set "BUILD_STATUS=%errorlevel%"
          type build.log
          exit /b %BUILD_STATUS%
      # The interpreter over the staged tree: the extension loads the runtime
      # library from lib/, the Prelude comes from its pinned ICurry.
      - name: Smoke test of the interpreter
        if: always()
        env:
          SPRITE_HOME: ${{ github.workspace }}\build\stage
          PYTHONPATH: ${{ github.workspace }}\build\stage\python
        run: |
          set -uxo pipefail
          ls build/stage/lib build/stage/python/curry/backends/cxx/curryrtbindings || true
          python -c "import curry; from curry.interpreter import flags; d = flags.get_default_flags(); print(curry.config.curryrt_lib_name(), d['interpret'] if isinstance(d, dict) else d)"
          python -c "import curry; from curry.lib import Prelude; print(curry.eval(Prelude.reverse([1, 2, 3])).one())"
          python -c "import curry; from curry.lib import Prelude; print(sorted(curry.eval(Prelude['?'](1, 2))))"
      # The JIT on Windows: the bitcode of the helpers from the clang of the
      # runner, llvmlite's LLJIT, the hot tier beside an evaluation long
      # enough to cross the threshold.
      - name: Smoke test of the JIT
        if: always()
        env:
          SPRITE_HOME: ${{ github.workspace }}\build\stage
          PYTHONPATH: ${{ github.workspace }}\build\stage\python
          SPRITE_JIT: hot
          SPRITE_JIT_THRESHOLD: '20'
        run: |
          set -uxo pipefail
          ls -l build/stage/lib/curryrt-helpers.bc
          python - <<'EOF'
          import curry, time
          from curry.lib import Prelude
          from curry.backends.cxx import llvmjit
          print('available:', llvmjit.available())
          t0 = time.perf_counter()
          print(curry.eval(Prelude.length(Prelude.replicate(2000000, 0))).one())
          print('eval %.2f s' % (time.perf_counter() - t0))
          deadline = time.monotonic() + 60
          while llvmjit.statistics()['hot'] == 0 and time.monotonic() < deadline:
            time.sleep(0.05)
          print(llvmjit.statistics())
          print(curry.eval(Prelude.length(Prelude.replicate(2000000, 0))).one())
          assert llvmjit.statistics()['hot'] > 0, 'the hot tier compiled nothing'
          EOF
      - name: Errors by file and by kind
        if: always()
        run: |
          set -uo pipefail
          [ -f build.log ] || { echo "no build log (the configure failed)"; exit 0; }
          echo "== errors by file:"
          { grep -oE '[A-Za-z0-9_./\\-]+\.(cpp|hpp|h)\([0-9]+(,[0-9]+)?\): (fatal )?error|[A-Za-z0-9_./\\-]+\.(cpp|hpp|h):[0-9]+:[0-9]+: (fatal )?error' build.log || true; } \
            | sed -E 's/(\([0-9,]+\)|:[0-9]+:[0-9]+): (fatal )?error//' | sort | uniq -c | sort -rn | head -60
          echo "== error kinds:"
          { grep -oE 'error C[0-9]+: [^\[]{0,70}|error: [^\[]{0,70}' build.log || true; } | sort | uniq -c | sort -rn | head -50
          echo "== link errors:"
          { grep -E 'lld-link: error|error LNK[0-9]+|LINK : fatal' build.log || true; } | sed -E 's/>>> referenced.*//' | sort | uniq -c | sort -rn | head -40
          echo "== failed steps of ninja:"
          { grep -E '^FAILED:' build.log || true; } | head -20
          echo "== totals:"
          grep -cE '(: |\): )(fatal )?error' build.log || true
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.name }}-${{ github.run_attempt }}
          path: |
            configure.log
            build.log
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/CMakeCache.txt
          if-no-files-found: warn
