name: Release the front end

# Publishes the wheels of curry-frontend that a green run of the workflow
# "Curry front end from source" built, to TestPyPI or to PyPI, through
# Trusted Publishing (no token is stored; PyPI trusts this workflow file in
# this repository, in the GitHub environment "pypi", which the maintainer
# protects with a required review).  Started by hand with the id of the run
# whose artifacts are published.  Issue #159 names the wheel curry_frontend;
# a run from before that rename is refused, so the old name never reaches
# an index.

'on':
  workflow_dispatch:
    inputs:
      run_id:
        description: The id of the green run of "Curry front end from source" whose wheels are published
        type: string
        required: true
      version:
        description: Front-end version built by the selected run
        type: choice
        options: ['2.0.0', '3.1.0']
        default: '2.0.0'
      index:
        description: The index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      macos:
        description: Include the macOS wheels of the run (four wheels in all); off for a Linux-only release of two
        type: boolean
        default: true
      windows:
        description: Include the Windows wheel of the run (the job windows, 3.1.0 only); it needs the stage and parity gates of that job
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  collect:
    name: collect the wheels of run ${{ inputs.run_id }}
    runs-on: ubuntu-24.04
    env:
      FRONTEND_VERSION: ${{ inputs.version }}
      FRONTEND_ARTIFACT_PREFIX: ${{ inputs.version == '3.1.0' && 'curry-frontend' || 'frontend' }}
      # Four wheels for either version: manylinux_2_28 x86-64 and aarch64,
      # macOS arm64 and x86-64 (issue #162); two, manylinux only, when the
      # input macos is off.
      INCLUDE_MACOS: ${{ inputs.macos }}
      INCLUDE_WINDOWS: ${{ inputs.windows }}
      EXPECTED_WHEELS: ${{ inputs.macos && (inputs.windows && '5' || '4') || (inputs.windows && '3' || '2') }}
      EXPECTED_MACOS: ${{ inputs.macos && '2' || '0' }}
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check the run and download its artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euxo pipefail
          gh run view "$RUN_ID" --json workflowName,conclusion,headBranch,headSha,displayTitle
          test "$(gh run view "$RUN_ID" --json workflowName --jq .workflowName)" = 'Curry front end from source'
          test "$(gh run view "$RUN_ID" --json conclusion --jq .conclusion)" = success
          gh run download "$RUN_ID" --pattern "${FRONTEND_ARTIFACT_PREFIX}-${FRONTEND_VERSION}-*" --dir artifacts
          if [ "$FRONTEND_VERSION" = 2.0.0 ] && [ "$INCLUDE_MACOS" = true ]; then
            # The macOS wheels of 2.0.0 come from the job macos of the run
            # under their own prefix; those of 3.1.0 share the prefix above.
            gh run download "$RUN_ID" --pattern 'frontend-macos-*' --dir artifacts
          fi
          if [ "$INCLUDE_MACOS" != true ]; then
            rm -rf artifacts/*macos*
          fi
          if [ "$INCLUDE_WINDOWS" = true ] && [ "$FRONTEND_VERSION" = 3.1.0 ]; then
            # The Windows wheel of 3.1.0 comes from the job windows under its
            # own prefix; the release takes it when its gates passed.
            gh run download "$RUN_ID" --pattern 'frontend-windows-*' --dir artifacts
          fi
          # A rerun keeps the artifacts of the earlier attempts on the run:
          # keep the latest attempt of each target.
          for dir in artifacts/*-[0-9]*; do
            latest=$(ls -d "${dir%-*}"-[0-9]* | sed 's/.*-//' | sort -n | tail -n 1)
            [ "${dir##*-}" = "$latest" ] || rm -r "$dir"
          done
          # Advisory jobs can fail while the run remains green. Require
          # every gate of the selected version to have passed on every target.
          outcomes=$(find artifacts -name outcome.txt | wc -l)
          test "$outcomes" = "$EXPECTED_WHEELS"
          for outcome in artifacts/*/outcome.txt; do
            for gate in fetch toolchain build wheel tag smoke stage parity; do
              grep -qx "$gate=success" "$outcome"
            done
          done
          # The tagged wheel of each target is under dist/ (manylinux_2_28 on
          # Linux, the macOS floor on macOS); the wheels/ directory holds the
          # untagged wheel, which PyPI refuses or which claims a wrong floor.
          mkdir -p dist
          find artifacts -path "*/dist/curry_frontend-${FRONTEND_VERSION}.post*-*.whl" -exec cp -v '{}' dist/ ';'
          ls -l dist
      - name: Refuse a run from before the rename, and a count other than the version's
        run: |
          set -euxo pipefail
          count=$(ls dist/*.whl | wc -l)
          named=$(ls dist/curry_frontend-*.whl 2>/dev/null | wc -l)
          macos=$(ls dist/curry_frontend-*macosx_*.whl 2>/dev/null | wc -l)
          if [ "$count" != "$EXPECTED_WHEELS" ] || [ "$named" != "$EXPECTED_WHEELS" ] || [ "$macos" != "$EXPECTED_MACOS" ]; then
            echo "expected $EXPECTED_WHEELS wheels named curry_frontend-*, $EXPECTED_MACOS of them macOS, found:" >&2
            ls -l dist >&2
            exit 1
          fi
      - name: Check the metadata and run the x86-64 wheel
        run: |
          set -euxo pipefail
          python3 -m venv tools
          tools/bin/python -m pip install --quiet twine
          tools/bin/python -m twine check --strict dist/*.whl
          python3 -m venv smoke
          smoke/bin/python -m pip install --no-index --no-deps dist/curry_frontend-${FRONTEND_VERSION}.post*-*manylinux*x86_64.whl
          test "$(timeout 30 smoke/bin/curry-frontend --numeric-version)" = "$FRONTEND_VERSION"
          timeout 30 smoke/bin/curry-frontend --version
      - uses: actions/upload-artifact@v4
        with:
          name: release-wheels-${{ inputs.run_id }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: publish to ${{ inputs.index }}
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: pypi
      url: ${{ inputs.index == 'pypi' && 'https://pypi.org/p/curry-frontend' || 'https://test.pypi.org/p/curry-frontend' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-wheels-${{ inputs.run_id }}
          path: dist
      - name: List what is published
        run: ls -l dist
      - name: Publish through Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.index == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
          packages-dir: dist
          print-hash: true
