name: CI

on:
  push:
    branches: [master, py314]
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      functional:
        description: Run the functional suites as well
        type: boolean
        default: true
      stress:
        description: Run the unit suite on the C++ backend in the collector stress mode as well
        type: boolean
        default: false
      interpreter:
        description: Run the interpreter tests and the functional suites with every module interpreted (interpret:all) as well
        type: boolean
        default: false

env:
  PAKCS_VERSION: '3.4.1'
  ICURRY_VERSION: '3.1.0'
  LC_ALL: C.UTF-8

jobs:
  test:
    name: ${{ matrix.backend }} backend ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # The py job builds the default configuration, without icurry.  The
      # cxx jobs configure icurry too, so that the tests compare both routes
      # from Curry to ICurry.
      matrix:
        include:
          - { backend: py, shard: '1/1', icurry: '' }
          - { backend: cxx, shard: '1/3', icurry: '$HOME/.cpm/bin/icurry' }
          - { backend: cxx, shard: '2/3', icurry: '$HOME/.cpm/bin/icurry' }
          - { backend: cxx, shard: '3/3', icurry: '$HOME/.cpm/bin/icurry' }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox g++ make libboost-dev curl ccache
          swipl --version
      # The C++ backend compiles the shared test modules with g++ in the
      # prepare pass of run-tests.sh, and the fresh modules of the tests at
      # run time.  ccache in front of g++ keeps the output of unchanged
      # modules between runs.
      - name: Put ccache in front of the compilers
        run: |
          mkdir -p "$HOME/ccache-bin"
          for cc in gcc g++ cc c++; do ln -sf "$(command -v ccache)" "$HOME/ccache-bin/$cc"; done
          # Sprite runs the compiler for generated code through a symlink named
          # cxx, which ccache cannot resolve by name; give it a wrapper.
          printf '#!/bin/sh\nexec ccache g++ "$@"\n' > "$HOME/ccache-bin/sprite-cxx"
          chmod +x "$HOME/ccache-bin/sprite-cxx"
          echo "$HOME/ccache-bin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.backend }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.backend }}-${{ matrix.shard }}-
      - name: Restore the Curry toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/pakcs-${{ env.PAKCS_VERSION }}
            ~/.cpm
            ~/.cpmrc
          key: curry-toolchain-ubuntu-24.04-pakcs${{ env.PAKCS_VERSION }}-icurry${{ env.ICURRY_VERSION }}-v1
      - name: Build the Curry toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: .github/scripts/install-curry-toolchain.sh
      # The tests compile the same Curry texts in every run.  The ICurry cache
      # (tests/.cache, an SQLite file keyed by the source text) keeps the
      # output of the Curry front end between runs.  It is saved after the
      # tests even when one fails, so a failing run still pays for the next.
      # A cache entry cannot be overwritten, so the saved key names the run:
      # the nightly schedule, which alone runs the functional suites, runs on
      # the sha of the last push and must save under a key of its own.  The
      # restore takes the newest entry of this job, or of any job.
      - name: Restore the ICurry cache
        uses: actions/cache/restore@v4
        with:
          path: tests/.cache
          key: icurry-cache-${{ matrix.backend }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            icurry-cache-${{ matrix.backend }}-${{ matrix.shard }}-
            icurry-cache-
      - name: Install Python packages
        run: python -m pip install --quiet numpy
      - name: Configure and stage
        run: |
          python ./configure \
            --with-python="$(command -v python)" \
            --with-cxx-postinstall="$HOME/ccache-bin/sprite-cxx" \
            --with-pakcs="$HOME/pakcs-$PAKCS_VERSION/bin/pakcs" \
            --with-icurry="${{ matrix.icurry }}"
          make stage
      - name: Unit tests
        run: .github/scripts/run-tests.sh ${{ matrix.backend }} 'unit_*.py' ${{ matrix.shard }}
      - name: Functional tests
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.functional)
        run: .github/scripts/run-tests.sh ${{ matrix.backend }} 'func_*.py' ${{ matrix.shard }}
      # Nothing to save when the stage failed before any test ran: the
      # directory does not exist then, and the save step would add a second
      # failure.
      - name: Save the ICurry cache
        if: always() && hashFiles('tests/.cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: tests/.cache
          key: icurry-cache-${{ matrix.backend }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}
      # Only the runtime library is cached so far: Sprite compiles and links
      # each generated module in one g++ call, which ccache does not cache.
      - name: Compiler cache statistics
        if: always()
        run: ccache -s | head -n 6

  # The stress mode of the collector (SPRITE_GC_STRESS=1): the C++ collector
  # runs at every safepoint, so a missing root fails a test at once instead
  # of once per million nodes.  The job runs the unit suite on the C++
  # backend in one shard, on the nightly schedule and on request; it does
  # not run on a push.  The steps are those of the test job; the caches are
  # restored from the cxx jobs and saved under keys of this job.
  stress:
    name: cxx backend, collector stress
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stress)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox g++ make libboost-dev curl ccache
          swipl --version
      - name: Put ccache in front of the compilers
        run: |
          mkdir -p "$HOME/ccache-bin"
          for cc in gcc g++ cc c++; do ln -sf "$(command -v ccache)" "$HOME/ccache-bin/$cc"; done
          printf '#!/bin/sh\nexec ccache g++ "$@"\n' > "$HOME/ccache-bin/sprite-cxx"
          chmod +x "$HOME/ccache-bin/sprite-cxx"
          echo "$HOME/ccache-bin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-cxx-stress-${{ github.sha }}
          restore-keys: |
            ccache-cxx-stress-
            ccache-cxx-
      - name: Restore the Curry toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/pakcs-${{ env.PAKCS_VERSION }}
            ~/.cpm
            ~/.cpmrc
          key: curry-toolchain-ubuntu-24.04-pakcs${{ env.PAKCS_VERSION }}-icurry${{ env.ICURRY_VERSION }}-v1
      - name: Build the Curry toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: .github/scripts/install-curry-toolchain.sh
      - name: Restore the ICurry cache
        uses: actions/cache/restore@v4
        with:
          path: tests/.cache
          key: icurry-cache-cxx-stress-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            icurry-cache-cxx-stress-
            icurry-cache-cxx-
            icurry-cache-
      - name: Install Python packages
        run: python -m pip install --quiet numpy
      - name: Configure and stage
        run: |
          python ./configure \
            --with-python="$(command -v python)" \
            --with-cxx-postinstall="$HOME/ccache-bin/sprite-cxx" \
            --with-pakcs="$HOME/pakcs-$PAKCS_VERSION/bin/pakcs" \
            --with-icurry="$HOME/.cpm/bin/icurry"
          make stage
      - name: Unit tests in the collector stress mode
        env:
          SPRITE_GC_STRESS: '1'
        run: .github/scripts/run-tests.sh cxx 'unit_*.py' 1/1
      - name: Save the ICurry cache
        if: always() && hashFiles('tests/.cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: tests/.cache
          key: icurry-cache-cxx-stress-${{ github.sha }}-${{ github.run_id }}
      - name: Compiler cache statistics
        if: always()
        run: ccache -s | head -n 6

  # The interpreter of the C++ runtime (the interpreter flag interpret:all;
  # see curry.interpreter.flags): every module is interpreted from its
  # ICurry, the Prelude included, and the compiled objects are not used.
  # The job runs the interpreter tests and the functional suites on request
  # only.  The whole unit suite is not run: the tests that read a generated
  # file, expect a compiled module, or time the compile fail by design in
  # this mode (see the dated TODO entry on the interpreter).  The steps are
  # those of the stress job; run-tests.sh adds the flags of SPRITE_TEST_FLAGS
  # to the backend flag.
  interpreter:
    name: cxx backend, interpreter
    if: github.event_name == 'workflow_dispatch' && inputs.interpreter
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox g++ make libboost-dev curl ccache
          swipl --version
      - name: Put ccache in front of the compilers
        run: |
          mkdir -p "$HOME/ccache-bin"
          for cc in gcc g++ cc c++; do ln -sf "$(command -v ccache)" "$HOME/ccache-bin/$cc"; done
          printf '#!/bin/sh\nexec ccache g++ "$@"\n' > "$HOME/ccache-bin/sprite-cxx"
          chmod +x "$HOME/ccache-bin/sprite-cxx"
          echo "$HOME/ccache-bin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-cxx-interpreter-${{ github.sha }}
          restore-keys: |
            ccache-cxx-interpreter-
            ccache-cxx-
      - name: Restore the Curry toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/pakcs-${{ env.PAKCS_VERSION }}
            ~/.cpm
            ~/.cpmrc
          key: curry-toolchain-ubuntu-24.04-pakcs${{ env.PAKCS_VERSION }}-icurry${{ env.ICURRY_VERSION }}-v1
      - name: Build the Curry toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: .github/scripts/install-curry-toolchain.sh
      - name: Restore the ICurry cache
        uses: actions/cache/restore@v4
        with:
          path: tests/.cache
          key: icurry-cache-cxx-interpreter-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            icurry-cache-cxx-interpreter-
            icurry-cache-cxx-
            icurry-cache-
      - name: Install Python packages
        run: python -m pip install --quiet numpy
      - name: Configure and stage
        run: |
          python ./configure \
            --with-python="$(command -v python)" \
            --with-cxx-postinstall="$HOME/ccache-bin/sprite-cxx" \
            --with-pakcs="$HOME/pakcs-$PAKCS_VERSION/bin/pakcs" \
            --with-icurry="$HOME/.cpm/bin/icurry"
          make stage
      - name: Interpreter tests with every module interpreted
        env:
          SPRITE_TEST_FLAGS: interpret:all
        run: .github/scripts/run-tests.sh cxx 'unit_cxx_interp.py' 1/1
      - name: Functional tests with every module interpreted
        env:
          SPRITE_TEST_FLAGS: interpret:all
        run: .github/scripts/run-tests.sh cxx 'func_*.py' 1/1
      - name: Save the ICurry cache
        if: always() && hashFiles('tests/.cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: tests/.cache
          key: icurry-cache-cxx-interpreter-${{ github.sha }}-${{ github.run_id }}
      - name: Compiler cache statistics
        if: always()
        run: ccache -s | head -n 6

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox g++ make libboost-dev curl
      - name: Restore the Curry toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/pakcs-${{ env.PAKCS_VERSION }}
            ~/.cpm
            ~/.cpmrc
          key: curry-toolchain-ubuntu-24.04-pakcs${{ env.PAKCS_VERSION }}-icurry${{ env.ICURRY_VERSION }}-v1
      - name: Build the Curry toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: .github/scripts/install-curry-toolchain.sh
      - name: Install Python packages
        run: python -m pip install --quiet numpy sphinx sphinx_rtd_theme
      - name: Configure, stage, and build the docs
        run: |
          python ./configure \
            --with-python="$(command -v python)" \
            --with-pakcs="$HOME/pakcs-$PAKCS_VERSION/bin/pakcs" \
            --with-icurry=""
          make stage
          make -C docs html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: object-root/docs/html

  deploy-docs:
    name: deploy docs
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Fails until GitHub Pages is enabled with the source set to GitHub
    # Actions; the failure does not mark the run red.
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
