name: CI

on:
  push:
    # A lane branch (wt/*) runs the same checks when it is pushed, so CI
    # overlaps the local verification of its merge instead of following it.
    branches: [master, 'wt/**']
  pull_request:
    branches: [master]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      functional:
        description: Run the functional suites as well
        type: boolean
        default: true
      stress:
        description: Run the unit suite on the C++ backend in the collector stress mode as well
        type: boolean
        default: false
      interpreter:
        description: Run the unit and functional suites of the C++ backend with every module interpreted (interpret:all) and with every module compiled (interpret:off) as well
        type: boolean
        default: false
      write_counters:
        description: Build the C++ runtime with the counters of writes into old nodes (make GC_WRITE_COUNTERS=1) and run the tests of the collector on it as well
        type: boolean
        default: false

env:
  PAKCS_VERSION: '3.10.0'
  ICURRY_VERSION: ''
  LC_ALL: C.UTF-8

jobs:
  test:
    name: ${{ matrix.backend }} backend ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # The default shards use the front end shipped by PAKCS and Sprite's port.
      matrix:
        include:
          - { backend: cxx, shard: '1/3', icurry: '' }
          - { backend: cxx, shard: '2/3', icurry: '' }
          - { backend: cxx, shard: '3/3', icurry: '' }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # The history: make overlay prunes the extracted products of the
          # sources that changed since the commit that packed the archive,
          # which it finds with git log; a shallow clone would prune
          # nothing and leave stale products in place.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox g++ make curl ccache
          swipl --version
      # The C++ backend compiles the shared test modules with g++ in the
      # prepare pass of run-tests.sh, and the fresh modules of the tests at
      # run time.  ccache in front of g++ keeps the output of unchanged
      # modules between runs.
      - name: Put ccache in front of the compilers
        run: |
          mkdir -p "$HOME/ccache-bin"
          for cc in gcc g++ cc c++; do ln -sf "$(command -v ccache)" "$HOME/ccache-bin/$cc"; done
          # Sprite runs the compiler for generated code through a symlink named
          # cxx, which ccache cannot resolve by name; give it a wrapper.
          printf '#!/bin/sh\nexec ccache g++ "$@"\n' > "$HOME/ccache-bin/sprite-cxx"
          chmod +x "$HOME/ccache-bin/sprite-cxx"
          echo "$HOME/ccache-bin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ matrix.backend }}-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.backend }}-${{ matrix.shard }}-
      - name: Restore the Curry toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/pakcs-${{ env.PAKCS_VERSION }}
            ~/.cpm
            ~/.cpmrc
          key: curry-toolchain-ubuntu-24.04-pakcs${{ env.PAKCS_VERSION }}-icurry${{ env.ICURRY_VERSION }}-v1
      - name: Build the Curry toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: .github/scripts/install-curry-toolchain.sh
      # The tests compile the same Curry texts in every run.  The ICurry cache
      # (tests/.cache, an SQLite file keyed by the source text) keeps the
      # output of the Curry front end between runs.  It is saved after the
      # tests even when one fails, so a failing run still pays for the next.
      # A cache entry cannot be overwritten, so the saved key names the run:
      # the nightly schedule, which alone runs the functional suites, runs on
      # the sha of the last push and must save under a key of its own.  The
      # restore takes the newest entry of this job, or of any job.
      - name: Restore the ICurry cache
        uses: actions/cache/restore@v4
        with:
          path: tests/.cache
          key: icurry-cache-${{ matrix.backend }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            icurry-cache-${{ matrix.backend }}-${{ matrix.shard }}-
            icurry-cache-
      - name: Install Python packages
        run: python -m pip install --quiet cmake ninja scikit-build-core numpy
      - name: Configure and stage
        run: |
          cmake -S . -B object-root/cmake -G Ninja \
            -DPython_EXECUTABLE="$(command -v python)" \
            -DWITH_CXX_POSTINSTALL="$HOME/ccache-bin/sprite-cxx" \
            -DWITH_PAKCS="$HOME/pakcs-$PAKCS_VERSION/bin/pakcs" \
            -DWITH_ICURRY="${{ matrix.icurry }}"
          make stage
      # The overlay archive under tests/overlay holds the
      # FlatCurry and ICurry products of the test programs (tests/README,
      # section 8).  It is extracted after the stage: the products are then
      # newer than the interfaces of the installed library, so the front
      # end leaves them alone, and sprite-make makes poker_four_of_a_kind
      # of smap, whose preprocessor currypp the runner lacks, from its
      # archived FlatCurry; extracted before the stage, the front end would
      # compile the module again and fail.  The prepare pass and the
      # functional suites need it; the checkout fetches the history for
      # its prune, and overlay-prune warns in a shallow clone.  The
      # extraction lists its members under make overlay V=1 alone.
      - name: Extract the test products of the overlay archive
        run: make overlay
      - name: Unit tests
        run: .github/scripts/run-tests.sh ${{ matrix.backend }} 'unit_*.py' ${{ matrix.shard }}
      - name: Functional tests
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.functional)
        run: .github/scripts/run-tests.sh ${{ matrix.backend }} 'func_*.py' ${{ matrix.shard }}
      # Nothing to save when the stage failed before any test ran: the
      # directory does not exist then, and the save step would add a second
      # failure.
      - name: Save the ICurry cache
        if: always() && hashFiles('tests/.cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: tests/.cache
          key: icurry-cache-${{ matrix.backend }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}
      # Only the runtime library is cached so far: Sprite compiles and links
      # each generated module in one g++ call, which ccache does not cache.
      - name: Compiler cache statistics
        if: always()
        run: ccache -s | head -n 6

  # Keep the old pair advisory until the owner retires it.
  legacy-tools:
    name: legacy tools, ${{ matrix.suite }} ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, func]
        shard: ['1/3', '2/3', '3/3']
    env:
      PAKCS_VERSION: '3.4.1'
      # Exercise the optional external translator as well.
      ICURRY_VERSION: '3.1.0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox g++ make curl
      - name: Restore the legacy Curry toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/pakcs-${{ env.PAKCS_VERSION }}
            ~/.cpm
            ~/.cpmrc
          key: curry-toolchain-ubuntu-24.04-pakcs${{ env.PAKCS_VERSION }}-icurry${{ env.ICURRY_VERSION }}-v1
      - name: Build the legacy Curry toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: .github/scripts/install-curry-toolchain.sh
      - name: Restore the legacy-tools ICurry cache
        uses: actions/cache/restore@v4
        with:
          path: tests/.cache
          key: icurry-legacy-${{ env.PAKCS_VERSION }}-${{ matrix.suite }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            icurry-legacy-${{ env.PAKCS_VERSION }}-${{ matrix.suite }}-${{ matrix.shard }}-
            icurry-legacy-${{ env.PAKCS_VERSION }}-
      - name: Install Python packages
        run: python -m pip install --quiet cmake ninja scikit-build-core numpy
      - name: Configure and stage
        run: |
          cmake -S . -B object-root/cmake -G Ninja \
            -DPython_EXECUTABLE="$(command -v python)" \
            -DWITH_PAKCS="$HOME/pakcs-$PAKCS_VERSION/bin/pakcs" \
            -DWITH_CURRY_FRONTEND="$HOME/pakcs-$PAKCS_VERSION/bin/pakcs-frontend" \
            -DWITH_ICURRY="$HOME/.cpm/bin/icurry"
          make stage
      - name: Extract the test products of the overlay archive
        run: make overlay
      - name: Unit shard
        if: matrix.suite == 'unit'
        run: .github/scripts/run-tests.sh cxx 'unit_*.py' ${{ matrix.shard }}
      - name: Functional shard
        if: matrix.suite == 'func' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.functional))
        run: .github/scripts/run-tests.sh cxx 'func_*.py' ${{ matrix.shard }}
      - name: Save the legacy-tools ICurry cache
        if: always() && hashFiles('tests/.cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: tests/.cache
          key: icurry-legacy-${{ env.PAKCS_VERSION }}-${{ matrix.suite }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}

  # The Python window: C++ unit suites only, on master pushes and dispatch.
  # Every lane gates the job: 3.11 through 3.15, and the free-threaded
  # 3.14t without the GIL, green twice on 2026-10-18.
  python-versions:
    name: python versions (${{ matrix.python }})
    if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { python: '3.11', experimental: false }
          - { python: '3.12', experimental: false }
          - { python: '3.13', experimental: false }
          - { python: '3.14', experimental: false }
          - { python: '3.15', experimental: false }
          - { python: '3.14t', experimental: false }
    steps:
      - name: Disable the GIL on the free-threaded lane
        if: matrix.python == '3.14t'
        run: echo 'PYTHON_GIL=0' >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          submodules: true
          # The history: make overlay prunes the extracted products of the
          # sources that changed since the commit that packed the archive,
          # which it finds with git log; a shallow clone would prune
          # nothing and leave stale products in place.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox g++ make curl ccache
          swipl --version
      # The C++ backend compiles the shared test modules with g++ in the
      # prepare pass of run-tests.sh, and the fresh modules of the tests at
      # run time.  ccache in front of g++ keeps the output of unchanged
      # modules between runs.
      - name: Put ccache in front of the compilers
        run: |
          mkdir -p "$HOME/ccache-bin"
          for cc in gcc g++ cc c++; do ln -sf "$(command -v ccache)" "$HOME/ccache-bin/$cc"; done
          # Sprite runs the compiler for generated code through a symlink named
          # cxx, which ccache cannot resolve by name; give it a wrapper.
          printf '#!/bin/sh\nexec ccache g++ "$@"\n' > "$HOME/ccache-bin/sprite-cxx"
          chmod +x "$HOME/ccache-bin/sprite-cxx"
          echo "$HOME/ccache-bin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-cxx-python${{ matrix.python }}-${{ github.sha }}
          restore-keys: |
            ccache-cxx-python${{ matrix.python }}-
            ccache-cxx-
      - name: Restore the Curry toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/pakcs-${{ env.PAKCS_VERSION }}
            ~/.cpm
            ~/.cpmrc
          key: curry-toolchain-ubuntu-24.04-pakcs${{ env.PAKCS_VERSION }}-icurry${{ env.ICURRY_VERSION }}-v1
      - name: Build the Curry toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: .github/scripts/install-curry-toolchain.sh
      # The tests compile the same Curry texts in every run.  The ICurry cache
      # (tests/.cache, an SQLite file keyed by the source text) keeps the
      # output of the Curry front end between runs.  It is saved after the
      # tests even when one fails, so a failing run still pays for the next.
      # Each Python has its own save key and can restore another C++ lane.
      - name: Restore the ICurry cache
        uses: actions/cache/restore@v4
        with:
          path: tests/.cache
          key: icurry-cache-cxx-python${{ matrix.python }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            icurry-cache-cxx-python${{ matrix.python }}-
            icurry-cache-cxx-
            icurry-cache-
      - name: Install Python packages
        run: python -m pip install --quiet cmake ninja scikit-build-core numpy
      - name: Configure and stage
        run: |
          cmake -S . -B object-root/cmake -G Ninja \
            -DPython_EXECUTABLE="$(command -v python)" \
            -DWITH_CXX_POSTINSTALL="$HOME/ccache-bin/sprite-cxx" \
            -DWITH_PAKCS="$HOME/pakcs-$PAKCS_VERSION/bin/pakcs" \
            -DWITH_ICURRY=
          make stage
      # The overlay archive under tests/overlay holds the
      # FlatCurry and ICurry products of the test programs (tests/README,
      # section 8).  It is extracted after the stage: the products are then
      # newer than the interfaces of the installed library, so the front
      # end leaves them alone, and sprite-make makes poker_four_of_a_kind
      # of smap, whose preprocessor currypp the runner lacks, from its
      # archived FlatCurry; extracted before the stage, the front end would
      # compile the module again and fail.  The prepare pass needs it;
      # the checkout fetches the history for its prune.  The
      # extraction lists its members under make overlay V=1 alone.
      - name: Extract the test products of the overlay archive
        run: make overlay
      - name: Unit tests
        run: .github/scripts/run-tests.sh cxx 'unit_*.py' 1/1
      # Without build isolation: curry-frontend is a build requirement of the
      # package (pyproject.toml), and it reaches PyPI only when the
      # maintainer publishes it; the isolated builds are the job of
      # wheels.yml, whose find-links serve the front end from the artifact
      # of frontend.yml meanwhile.  The build tools are installed above.
      - name: Build the release wheel
        if: matrix.python == '3.14'
        run: python -m pip wheel . --no-deps --no-build-isolation --wheel-dir object-root/wheels
      - name: Free-threaded extension opt-in without PYTHON_GIL
        if: matrix.python == '3.14t'
        run: env -u PYTHON_GIL .github/scripts/run-tests.sh cxx unit_free_threading.py 1/1

      # Nothing to save when the stage failed before any test ran: the
      # directory does not exist then, and the save step would add a second
      # failure.
      - name: Save the ICurry cache
        if: always() && hashFiles('tests/.cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: tests/.cache
          key: icurry-cache-cxx-python${{ matrix.python }}-${{ github.sha }}-${{ github.run_id }}
      # Only the runtime library is cached so far: Sprite compiles and links
      # each generated module in one g++ call, which ccache does not cache.
      - name: Compiler cache statistics
        if: always()
        run: ccache -s | head -n 6

  # macOS (issue #162): the runtime and the Curry library build with the
  # compilers of the Xcode command line tools, and the unit suite runs in
  # the default mode of the platform, interpret:tiered, as on Linux: the
  # swap of the tiered mode binds a compiled object to the tables the
  # interpreter made through slots the loader fills (issue #163; see
  # curry.interpreter.flags).  The front end is built from source on the
  # runner, as frontend.yml builds it, and cached by the recipe that made it
  # and the architecture; the first run of a new recipe takes about half an
  # hour more.  Apple Silicon (macos-15) gates master since its second green
  # run in the default mode (runs 40155455473 and 40161622699); Intel
  # (macos-15-intel; step 5) gates master since its third green run in a
  # row (runs 40199675174, 40209733256 and 40223622532).
  macos:
    name: macOS ${{ matrix.arch }} ${{ matrix.shard }}
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/wt/macos')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
        shard: ['1/2', '2/2']
        include:
          - runner: macos-15
            arch: arm64
            experimental: false
          - runner: macos-15-intel
            arch: x86_64
            experimental: false
    env:
      GHC_VERSION: '9.8.4'
      CABAL_VERSION: '3.10.3.0'
      FRONTEND_VERSION: '3.1.0'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # The history, for the prune of make overlay (see the test job).
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # GMP for the front end, GNU coreutils for the timeout command of the
      # test scripts, GNU make for the thin wrapper; the gnubin directories
      # give the tools their GNU names.
      - name: Install the Homebrew packages
        run: |
          set -euxo pipefail
          brew install gmp coreutils make gnu-time
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix gnu-time)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Restore the Curry front end
        id: frontend
        uses: actions/cache@v4
        with:
          path: frontend-work/bundle
          key: curry-frontend-macos-${{ env.FRONTEND_VERSION }}-${{ matrix.arch }}-ghc${{ env.GHC_VERSION }}-${{ hashFiles('frontend/patches/*.patch', 'frontend/build.sh', 'frontend/package.py', 'frontend/fetch.py', '.github/scripts/install-curry-frontend-macos.sh') }}
      - name: Build the Curry front end from source
        if: steps.frontend.outputs.cache-hit != 'true'
        run: .github/scripts/install-curry-frontend-macos.sh
      - name: Restore the ICurry cache
        uses: actions/cache/restore@v4
        with:
          path: tests/.cache
          key: icurry-cache-macos-${{ matrix.arch }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            icurry-cache-macos-${{ matrix.arch }}-${{ matrix.shard }}-
            icurry-cache-macos-${{ matrix.arch }}-
      - name: Install Python packages
        run: python -m pip install --quiet cmake ninja scikit-build-core numpy
      - name: Configure and stage
        run: |
          set -euxo pipefail
          test "$(timeout 30 frontend-work/bundle/bin/curry-frontend --numeric-version)" = 3.1.0
          cmake -S . -B object-root/cmake -G Ninja \
            -DPython_EXECUTABLE="$(command -v python)" \
            -DWITH_PAKCS= -DWITH_ICURRY= \
            -DWITH_CURRY_FRONTEND="$PWD/frontend-work/bundle/bin/curry-frontend"
          # The runtime first, with every translation unit compiled whatever
          # fails, so one run of the job reports every error of a new compiler.
          cmake --build object-root/cmake --target curryrt _curryrtbindings --parallel -- -k 0
          make stage
      - name: Extract the test products of the overlay archive
        run: make overlay
      # The C++ programs of the tests compile against the installed headers
      # with -Wall and expect a silent compiler; the step shows what the
      # compiler of the platform says about the headers, for every program
      # at once.
      - name: The C++ test programs compile without warnings
        run: |
          set -uo pipefail
          status=0
          for source in tests/data/cxx/*.cpp; do
            echo "::group::$source"
            if ! install/tools/cxx -std=c++17 -O2 -Wall -Iinstall/include "$source" \
                 -o "${TMPDIR:-/tmp}/program" -Linstall/lib -lcurryrt 2> "${TMPDIR:-/tmp}/program.err"; then
              status=1
            fi
            cat "${TMPDIR:-/tmp}/program.err"
            test -s "${TMPDIR:-/tmp}/program.err" && status=1
            echo "::endgroup::"
          done
          exit $status
      - name: Unit tests, the default mode of the platform
        run: .github/scripts/run-tests.sh cxx 'unit_*.py' ${{ matrix.shard }}
      - name: Save the ICurry cache
        if: always() && hashFiles('tests/.cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: tests/.cache
          key: icurry-cache-macos-${{ matrix.arch }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}
      - name: Upload the logs of the front end build on a failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-frontend-logs-${{ strategy.job-index }}
          path: |
            frontend-work/logs/
            frontend-work/build/*.txt
            frontend-work/build/*.log
          if-no-files-found: ignore

  # The stress mode of the collector (SPRITE_GC_STRESS=1): the C++ collector
  # runs at every safepoint, so a missing root fails a test at once instead
  # of once per million nodes.  The job runs the unit suite on the C++
  # backend in one shard, on the nightly schedule and on request; it does
  # not run on a push.  The steps are those of the test job; the caches are
  # restored from the cxx jobs and saved under keys of this job.
  stress:
    name: cxx backend, collector stress
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.stress)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # The history: make overlay prunes the extracted products of the
          # sources that changed since the commit that packed the archive,
          # which it finds with git log; a shallow clone would prune
          # nothing and leave stale products in place.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox g++ make curl ccache
          swipl --version
      - name: Put ccache in front of the compilers
        run: |
          mkdir -p "$HOME/ccache-bin"
          for cc in gcc g++ cc c++; do ln -sf "$(command -v ccache)" "$HOME/ccache-bin/$cc"; done
          printf '#!/bin/sh\nexec ccache g++ "$@"\n' > "$HOME/ccache-bin/sprite-cxx"
          chmod +x "$HOME/ccache-bin/sprite-cxx"
          echo "$HOME/ccache-bin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-cxx-stress-${{ github.sha }}
          restore-keys: |
            ccache-cxx-stress-
            ccache-cxx-
      - name: Restore the Curry toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/pakcs-${{ env.PAKCS_VERSION }}
            ~/.cpm
            ~/.cpmrc
          key: curry-toolchain-ubuntu-24.04-pakcs${{ env.PAKCS_VERSION }}-icurry${{ env.ICURRY_VERSION }}-v1
      - name: Build the Curry toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: .github/scripts/install-curry-toolchain.sh
      - name: Restore the ICurry cache
        uses: actions/cache/restore@v4
        with:
          path: tests/.cache
          key: icurry-cache-cxx-stress-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            icurry-cache-cxx-stress-
            icurry-cache-cxx-
            icurry-cache-
      - name: Install Python packages
        run: python -m pip install --quiet cmake ninja scikit-build-core numpy
      - name: Configure and stage
        run: |
          cmake -S . -B object-root/cmake -G Ninja \
            -DPython_EXECUTABLE="$(command -v python)" \
            -DWITH_CXX_POSTINSTALL="$HOME/ccache-bin/sprite-cxx" \
            -DWITH_PAKCS="$HOME/pakcs-$PAKCS_VERSION/bin/pakcs" \
            -DWITH_ICURRY=
          make stage
      # The overlay archive, after the stage (see the test job).
      - name: Extract the test products of the overlay archive
        run: make overlay
      - name: Unit tests in the collector stress mode
        env:
          SPRITE_GC_STRESS: '1'
        run: .github/scripts/run-tests.sh cxx 'unit_*.py' 1/1
      - name: Save the ICurry cache
        if: always() && hashFiles('tests/.cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: tests/.cache
          key: icurry-cache-cxx-stress-${{ github.sha }}-${{ github.run_id }}
      - name: Compiler cache statistics
        if: always()
        run: ccache -s | head -n 6

  # The counters of writes into old nodes (make GC_WRITE_COUNTERS=1; see
  # src/curryrt/graph/gc/wdgc.cpp and tests/README, section 4): the branches
  # of unit_cxx_gc_counters.py and unit_cxx_heap.py that check the counts
  # and the calls run on this build alone.  The job runs on request; it
  # does not run on a push or on the schedule.  The steps are those of the
  # stress job with the build variable; the caches are restored from the
  # cxx jobs and saved under keys of this job.
  write-counters:
    name: cxx backend, write counters
    if: github.event_name == 'workflow_dispatch' && inputs.write_counters
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # The history: make overlay prunes the extracted products of the
          # sources that changed since the commit that packed the archive,
          # which it finds with git log; a shallow clone would prune
          # nothing and leave stale products in place.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox g++ make curl ccache binutils
          swipl --version
      - name: Put ccache in front of the compilers
        run: |
          mkdir -p "$HOME/ccache-bin"
          for cc in gcc g++ cc c++; do ln -sf "$(command -v ccache)" "$HOME/ccache-bin/$cc"; done
          printf '#!/bin/sh\nexec ccache g++ "$@"\n' > "$HOME/ccache-bin/sprite-cxx"
          chmod +x "$HOME/ccache-bin/sprite-cxx"
          echo "$HOME/ccache-bin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-cxx-write-counters-${{ github.sha }}
          restore-keys: |
            ccache-cxx-write-counters-
            ccache-cxx-
      - name: Restore the Curry toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/pakcs-${{ env.PAKCS_VERSION }}
            ~/.cpm
            ~/.cpmrc
          key: curry-toolchain-ubuntu-24.04-pakcs${{ env.PAKCS_VERSION }}-icurry${{ env.ICURRY_VERSION }}-v1
      - name: Build the Curry toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: .github/scripts/install-curry-toolchain.sh
      - name: Restore the ICurry cache
        uses: actions/cache/restore@v4
        with:
          path: tests/.cache
          key: icurry-cache-cxx-write-counters-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            icurry-cache-cxx-write-counters-
            icurry-cache-cxx-
            icurry-cache-
      - name: Install Python packages
        run: python -m pip install --quiet cmake ninja scikit-build-core numpy
      - name: Configure and stage with the write counters
        run: |
          cmake -S . -B object-root/cmake -G Ninja \
            -DPython_EXECUTABLE="$(command -v python)" \
            -DWITH_CXX_POSTINSTALL="$HOME/ccache-bin/sprite-cxx" \
            -DWITH_PAKCS="$HOME/pakcs-$PAKCS_VERSION/bin/pakcs" \
            -DWITH_ICURRY=
          make GC_WRITE_COUNTERS=1 stage
          test "$(cat install/sysconfig/cxx_gc_write_counters)" = 1
      # The overlay archive, after the stage (see the test job).
      - name: Extract the test products of the overlay archive
        run: make overlay
      - name: Tests of the collector and the heap
        run: .github/scripts/run-tests.sh cxx 'unit_cxx_[gh]*.py' 1/1
      - name: Tests of the collector in the stress mode
        env:
          SPRITE_GC_STRESS: '1'
        run: .github/scripts/run-tests.sh cxx 'unit_cxx_gc*.py' 1/1
      - name: Save the ICurry cache
        if: always() && hashFiles('tests/.cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: tests/.cache
          key: icurry-cache-cxx-write-counters-${{ github.sha }}-${{ github.run_id }}
      - name: Compiler cache statistics
        if: always()
        run: ccache -s | head -n 6

  # The other modes of the interpreter flag interpret of the C++ backend
  # (see curry.interpreter.flags).  Under interpret:all every module is
  # interpreted from its ICurry, the Prelude included, and the compiled
  # objects are not used; under interpret:off every module is compiled with
  # g++ before it runs.  The jobs run the whole unit suite and the
  # functional suites in each mode, on the nightly schedule and on request:
  # tests that read a compiled object skip under all
  # (cytest.skipIfInterpreted; section 4 of tests/README).  The steps are
  # those of the stress job; run-tests.sh adds the flags of
  # SPRITE_TEST_FLAGS to the backend flag, and runs the prepare pass under
  # off.  The interpreter is slow: the unit suite under all took 125
  # minutes on one runner and the functional suites longer (2026-10-19),
  # more than the limit of a job together, so each suite under all runs
  # in two shards of run-tests.sh, each a job of its own; under off, a
  # job per suite.  The tag names a job's caches.
  interpreter:
    name: cxx backend, interpret:${{ matrix.mode }}, ${{ matrix.suite }} ${{ matrix.shard }}
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.interpreter)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        # Quoted: a bare off is a Boolean in YAML.
        include:
          - {mode: 'all', suite: unit, pattern: 'unit_*.py', shard: 1/2, tag: all-unit-1}
          - {mode: 'all', suite: unit, pattern: 'unit_*.py', shard: 2/2, tag: all-unit-2}
          - {mode: 'all', suite: func, pattern: 'func_*.py', shard: 1/2, tag: all-func-1}
          - {mode: 'all', suite: func, pattern: 'func_*.py', shard: 2/2, tag: all-func-2}
          - {mode: 'off', suite: unit, pattern: 'unit_*.py', shard: 1/1, tag: off-unit}
          - {mode: 'off', suite: func, pattern: 'func_*.py', shard: 1/1, tag: off-func}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          # The history: make overlay prunes the extracted products of the
          # sources that changed since the commit that packed the archive,
          # which it finds with git log; a shallow clone would prune
          # nothing and leave stale products in place.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox g++ make curl ccache
          swipl --version
      - name: Put ccache in front of the compilers
        run: |
          mkdir -p "$HOME/ccache-bin"
          for cc in gcc g++ cc c++; do ln -sf "$(command -v ccache)" "$HOME/ccache-bin/$cc"; done
          printf '#!/bin/sh\nexec ccache g++ "$@"\n' > "$HOME/ccache-bin/sprite-cxx"
          chmod +x "$HOME/ccache-bin/sprite-cxx"
          echo "$HOME/ccache-bin" >> "$GITHUB_PATH"
          echo "CCACHE_DIR=$HOME/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-cxx-interpreter-${{ matrix.tag }}-${{ github.sha }}
          restore-keys: |
            ccache-cxx-interpreter-${{ matrix.tag }}-
            ccache-cxx-interpreter-
            ccache-cxx-
      - name: Restore the Curry toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/pakcs-${{ env.PAKCS_VERSION }}
            ~/.cpm
            ~/.cpmrc
          key: curry-toolchain-ubuntu-24.04-pakcs${{ env.PAKCS_VERSION }}-icurry${{ env.ICURRY_VERSION }}-v1
      - name: Build the Curry toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: .github/scripts/install-curry-toolchain.sh
      - name: Restore the ICurry cache
        uses: actions/cache/restore@v4
        with:
          path: tests/.cache
          key: icurry-cache-cxx-interpreter-${{ matrix.tag }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            icurry-cache-cxx-interpreter-${{ matrix.tag }}-
            icurry-cache-cxx-interpreter-
            icurry-cache-cxx-
            icurry-cache-
      - name: Install Python packages
        run: python -m pip install --quiet cmake ninja scikit-build-core numpy
      - name: Configure and stage
        run: |
          cmake -S . -B object-root/cmake -G Ninja \
            -DPython_EXECUTABLE="$(command -v python)" \
            -DWITH_CXX_POSTINSTALL="$HOME/ccache-bin/sprite-cxx" \
            -DWITH_PAKCS="$HOME/pakcs-$PAKCS_VERSION/bin/pakcs" \
            -DWITH_ICURRY=
          make stage
      # The overlay archive, after the stage (see the test job).
      - name: Extract the test products of the overlay archive
        run: make overlay
      - name: Tests under interpret:${{ matrix.mode }}, ${{ matrix.suite }} ${{ matrix.shard }}
        env:
          SPRITE_TEST_FLAGS: interpret:${{ matrix.mode }}
        run: .github/scripts/run-tests.sh cxx '${{ matrix.pattern }}' ${{ matrix.shard }}
      - name: Save the ICurry cache
        if: always() && hashFiles('tests/.cache/**') != ''
        uses: actions/cache/save@v4
        with:
          path: tests/.cache
          key: icurry-cache-cxx-interpreter-${{ matrix.tag }}-${{ github.sha }}-${{ github.run_id }}
      - name: Compiler cache statistics
        if: always()
        run: ccache -s | head -n 6

  docs:
    name: docs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox g++ make curl
      - name: Restore the Curry toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/pakcs-${{ env.PAKCS_VERSION }}
            ~/.cpm
            ~/.cpmrc
          key: curry-toolchain-ubuntu-24.04-pakcs${{ env.PAKCS_VERSION }}-icurry${{ env.ICURRY_VERSION }}-v1
      - name: Build the Curry toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: .github/scripts/install-curry-toolchain.sh
      - name: Install Python packages
        run: python -m pip install --quiet cmake ninja scikit-build-core numpy sphinx sphinx_rtd_theme
      - name: Configure, stage, and build the docs
        run: |
          cmake -S . -B object-root/cmake -G Ninja \
            -DPython_EXECUTABLE="$(command -v python)" \
            -DWITH_PAKCS="$HOME/pakcs-$PAKCS_VERSION/bin/pakcs" \
            -DWITH_ICURRY=""
          make stage
          make -C docs html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: object-root/docs/html

  deploy-docs:
    name: deploy docs
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    # Fails until GitHub Pages is enabled with the source set to GitHub
    # Actions; the failure does not mark the run red.
    continue-on-error: true
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
