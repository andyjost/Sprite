name: CPM index

on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  PAKCS_VERSION: '3.10.0'
  ICURRY_VERSION: ''
  LC_ALL: C.UTF-8
  SPRITE_FRONTEND_WARNINGS: '0'

jobs:
  index:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Check completed expectations and measured shard budget
        env:
          CPM_INDEX_SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PYTHON'
          import json
          import os
          import sys
          with open('tests/data/cpm/index-expected.json') as stream:
              expected = json.load(stream)
          if not expected.get('complete', False):
              sys.exit('CPM index expectations are incomplete; finish the survey before enabling CI.')
          shard = int(os.environ['CPM_INDEX_SHARD'])
          packages = [pin for pin in expected['packages'].values() if pin['shard'] == shard]
          seconds = sum(pin['measured_seconds'] for pin in packages)
          if not packages or seconds > 90 * 60:
              sys.exit('CPM shard exceeds its measured 90-minute package budget.')
          print(f'Shard {shard}: {len(packages)} packages, {seconds / 60:.1f} measured minutes; '
                '30 minutes reserved for setup.')
          PYTHON
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends swi-prolog-nox g++ make curl sqlite3
      - name: Restore the Curry toolchain
        id: toolchain
        uses: actions/cache@v4
        with:
          path: ~/pakcs-${{ env.PAKCS_VERSION }}
          key: cpm-index-toolchain-ubuntu-24.04-pakcs${{ env.PAKCS_VERSION }}-v1
      - name: Build the Curry toolchain
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          python scripts/cpm-index-run.py --label PAKCS \
            --url "https://www.curry-lang.org/pakcs/download/pakcs-$PAKCS_VERSION-amd64-Linux.tar.gz" \
            --acquire bash .github/scripts/install-curry-toolchain.sh
      - name: Install Python packages
        run: python -m pip install --quiet cmake ninja scikit-build-core numpy
      - name: Configure and stage
        run: |
          cmake -S . -B object-root/cmake -G Ninja \
            -DPython_EXECUTABLE="$(command -v python)" \
            -DWITH_PAKCS="$HOME/pakcs-$PAKCS_VERSION/bin/pakcs" \
            -DWITH_ICURRY=
          make stage
      - name: Prepare private CPM tools
        run: |
          pakcs_home="$HOME/pakcs-$PAKCS_VERSION"
          export HOME="$RUNNER_TEMP/sprite-cpm-home"
          mkdir -p "$HOME"
          export PATH="$GITHUB_WORKSPACE/install/bin:$pakcs_home/bin:$PATH"
          export PYTHONPATH="$GITHUB_WORKSPACE/install/python"
          cat > "$HOME/.cpmrc" <<'CPMRC'
          PACKAGEINDEXURL=https://cpm.curry-lang.org/PACKAGES/INDEX.tar.gz
          PACKAGETARFILESURL=https://cpm.curry-lang.org/PACKAGES
          CPMRC
          limit_stack() {
            sed -i "/^exec / { s/--stack_limit=[^ ]*//g; s/ -g 'set_prolog_flag(stack_limit,[0-9]*)'//g; s/ -x / -g 'set_prolog_flag(stack_limit,4294967296)' -x /; }" "$@"
          }
          for state in src/pakcs currytools/cpm/src/CPM.Main currytools/optimize/BindingOpt; do
            limit_stack "$pakcs_home/$state"
          done
          python scripts/cpm-index-run.py --label CPM-index --url https://cpm.curry-lang.org/PACKAGES/INDEX.tar.gz --acquire timeout 600 "$pakcs_home/bin/cypm" update
          python scripts/cpm-test-overlay.py "$HOME/.cpm/index" "$HOME/sprite-index" --snapshot tests/data/cpm/index-expected.json
          printf 'REPOSITORYPATH=%s\n' "$HOME/sprite-index" >> "$HOME/.cpmrc"
          python scripts/cpm-index-run.py --label currypp --url https://cpm.curry-lang.org/PACKAGES --acquire timeout 1800 "$pakcs_home/bin/cypm" -d REPOSITORYPATH="$HOME/sprite-index" -d CURRYBIN="$pakcs_home/bin/pakcs" install currypp
          limit_stack "$HOME/.cpm/bin/currypp"
          export PATH="$HOME/.cpm/bin:$PATH"
          python scripts/cpm-index-run.py --label currycheck --url https://cpm.curry-lang.org/PACKAGES --acquire timeout 1800 "$pakcs_home/bin/cypm" -d REPOSITORYPATH="$HOME/sprite-index" -d CURRYBIN="$GITHUB_WORKSPACE/install/bin/sprite" checkout currycheck 4.0.0 -o "$HOME/currycheck-framework"
          python scripts/cpm-test-overlay.py "$HOME/.cpm/index" "$HOME/sprite-index" --snapshot tests/data/cpm/index-expected.json --packages "$HOME/.cpm/packages" "$HOME/currycheck-framework"
          python scripts/cpm-currycheck-prepare.py "$HOME/currycheck-framework"
          (
            cd "$HOME/currycheck-framework"
            python "$GITHUB_WORKSPACE/scripts/cpm-index-run.py" --label currycheck --url https://cpm.curry-lang.org/PACKAGES --acquire timeout 1800 "$pakcs_home/bin/cypm" -d REPOSITORYPATH="$HOME/sprite-index" -d CURRYBIN="$GITHUB_WORKSPACE/install/bin/sprite" install
          )
          test -x "$HOME/.cpm/bin/curry-check"
          mkdir "$HOME/framework-bin"
          cp "$HOME/.cpm/bin/curry-check" "$HOME/framework-bin/curry-check"
      - name: Verify quantified properties run on Sprite
        run: |
          pakcs_home="$HOME/pakcs-$PAKCS_VERSION"
          export HOME="$RUNNER_TEMP/sprite-cpm-home"
          export PATH="$HOME/framework-bin:$HOME/.cpm/bin:$GITHUB_WORKSPACE/install/bin:$pakcs_home/bin:$PATH"
          export PYTHONPATH="$GITHUB_WORKSPACE/tests/lib:$GITHUB_WORKSPACE/install/python"
          export SPRITE_CPM_INDEX_CHECKER="$HOME/framework-bin"
          cd tests
          "$GITHUB_WORKSPACE/install/bin/python" -m unittest \
            unit_cpm_search.TestCPMSearch.test_quantified_properties_use_sprite
      - name: List newer compatible package versions
        continue-on-error: true
        run: |
          pakcs_home="$HOME/pakcs-$PAKCS_VERSION"
          export PATH="$pakcs_home/bin:$PATH"
          export HOME="$RUNNER_TEMP/sprite-cpm-home"
          python scripts/cpm-index-run.py --cypm "$pakcs_home/bin/cypm" \
            --sprite "$GITHUB_WORKSPACE/install/bin/sprite" \
            --index "$HOME/.cpm/index" --work object-root/cpm-index \
            --expected tests/data/cpm/index-expected.json --newer
      - name: Run pinned package suites
        run: |
          pakcs_home="$HOME/pakcs-$PAKCS_VERSION"
          export HOME="$RUNNER_TEMP/sprite-cpm-home"
          export PATH="$HOME/framework-bin:$HOME/.cpm/bin:$GITHUB_WORKSPACE/install/bin:$pakcs_home/bin:$PATH"
          export PYTHONPATH="$GITHUB_WORKSPACE/install/python"
          python scripts/cpm-index-run.py --cypm "$pakcs_home/bin/cypm" \
            --sprite "$GITHUB_WORKSPACE/install/bin/sprite" \
            --index "$HOME/.cpm/index" --work object-root/cpm-index \
            --expected tests/data/cpm/index-expected.json \
            --shard ${{ matrix.shard }} --shards 8 --csv CPM-INDEX.csv
      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpm-index-${{ matrix.shard }}
          path: |
            CPM-INDEX.csv
            object-root/cpm-index/*.log
