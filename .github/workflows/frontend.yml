name: Curry front end from source

'on':
  push:
    branches: [master, wt/frontend]
    paths:
      - frontend/**
      - conda/curry-frontend/**
      - src/python/config.py
      - .github/workflows/frontend.yml
  workflow_dispatch:
    inputs:
      source_url:
        description: Reviewed source archive URL (requires source_sha256)
        type: string
        default: ''
      source_sha256:
        description: Reviewed source archive SHA-256 (requires source_url)
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.version }}, ${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    # Keep the Ubuntu hosts; link dynamically against glibc 2.28 and bundle
    # the container's GMP. AlmaLinux 8 does not provide a static GMP archive.
    container:
      image: ${{ matrix.image }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86-64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
            ghc: '8.8.3'
            version: '2.0.0'
            experimental: false
          - name: aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
            ghc: '9.6.7'
            version: '2.0.0'
            experimental: false
          - name: x86-64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_28_x86_64
            ghc: '9.8.4'
            version: '3.1.0'
            experimental: true
          - name: aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_28_aarch64
            ghc: '9.8.4'
            version: '3.1.0'
            experimental: true
    defaults:
      run:
        shell: bash
    env:
      LC_ALL: C.UTF-8
      # The container's default home has a different owner; Stack refuses it.
      # Job scope also covers failure collection and action steps.
      HOME: ${{ github.workspace }}/frontend-work/home
      STACK_ROOT: ${{ github.workspace }}/frontend-work/home/.stack
      CABAL_DIR: ${{ github.workspace }}/frontend-work/home/.cabal
      GHCUP_INSTALL_BASE_PREFIX: ${{ github.workspace }}/frontend-work/home
      SPRITE_CACHE_FILE: ''
      SPRITE_PRODUCT_CACHE: ''
      SPRITE_CURRY2ICURRY: frontend
      FRONTEND_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Select the container's CPython 3.14
        run: |
          set -euxo pipefail
          test -x /opt/python/cp314-cp314/bin/python
          echo /opt/python/cp314-cp314/bin >> "$GITHUB_PATH"
      - name: Runner and system dependencies
        run: |
          set -euxo pipefail
          mkdir -p frontend-work/logs "$HOME" "$STACK_ROOT" "$CABAL_DIR"
          exec > >(tee frontend-work/logs/runner.log) 2>&1
          id
          ls -ld "$HOME" "$STACK_ROOT" "$CABAL_DIR" "$GHCUP_INSTALL_BASE_PREFIX"
          uname -a
          cat /etc/os-release
          python --version
          dnf install -y gcc gcc-c++ make binutils curl pkgconf-pkg-config \
            patch gmp-devel glibc-devel zlib-devel \
            ncurses-devel ncurses-compat-libs numactl-libs patchelf file xz
          rpm -q glibc glibc-devel gmp gmp-devel
          python -m pip install --verbose 'setuptools>=68' wheel auditwheel numpy cmake ninja scikit-build-core
          python -m pip list
          gcc --version
          ldd --version
          patchelf --version
          python -m auditwheel --version
      - name: Fetch and inspect source, separately from compilation
        id: fetch
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
        run: |
          set -euxo pipefail
          args=(--version "$FRONTEND_VERSION")
          if [ -n "$SOURCE_URL$SOURCE_SHA256" ]; then
            args+=(--url "$SOURCE_URL" --sha256 "$SOURCE_SHA256")
          fi
          python frontend/fetch.py --output frontend-work/fetch "${args[@]}" \
            2>&1 | tee frontend-work/logs/fetch.log
      - name: Set up the target Haskell toolchain
        id: toolchain
        env:
          EXPECTED_GHC: ${{ matrix.ghc }}
        run: |
          set -euxo pipefail
          exec > >(tee frontend-work/logs/toolchain.log) 2>&1
          # The job's writable home also holds ghcup, Cabal, and Stack state.
          export BOOTSTRAP_HASKELL_NONINTERACTIVE=1
          export BOOTSTRAP_HASKELL_MINIMAL=1
          export BOOTSTRAP_HASKELL_ADJUST_BASHRC=0
          curl --fail --location --retry 3 https://get-ghcup.haskell.org \
            --output frontend-work/ghcup-bootstrap.sh
          sha256sum frontend-work/ghcup-bootstrap.sh
          bash frontend-work/ghcup-bootstrap.sh
          export PATH="$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin:$PATH"
          echo "$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin" >> "$GITHUB_PATH"
          ghcup --version
          ghcup --verbose install ghc "$EXPECTED_GHC"
          ghcup set ghc "$EXPECTED_GHC"
          ghcup --verbose install cabal 3.10.3.0
          ghcup set cabal 3.10.3.0
          if [ "$(uname -m)" = x86_64 ] || [ "$FRONTEND_VERSION" = 3.1.0 ]; then
            ghcup --verbose install stack 2.15.7
            ghcup set stack 2.15.7
            stack --version
          fi
          for tool in ghc ghc-pkg cabal; do
            command -v "$tool"
            readlink -f "$(command -v "$tool")"
            "$tool" --version
          done
          test "$(ghc --numeric-version)" = "$EXPECTED_GHC"
          test "$(cabal --numeric-version)" = 3.10.3.0
      - name: Build the selected version with dynamic system libraries in manylinux 2.28
        id: compile
        run: |
          set -euxo pipefail
          bash frontend/build.sh frontend-work/fetch/source frontend-work/build "$FRONTEND_VERSION" \
            2>&1 | tee frontend-work/logs/build.log
      # Packaging is independent of the parity outcome. An experimental
      # wheel is useful even when the compiler differs; it is never released.
      - name: Bundle the executable and build a platform wheel
        id: wheel
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          set -euxo pipefail
          python frontend/package.py --binary frontend-work/build/curry-frontend \
            --licenses frontend-work/fetch/licenses --output frontend-work/wheels \
            2>&1 | tee frontend-work/logs/wheel.log
          python frontend/package.py --binary frontend-work/build/curry-frontend \
            --licenses frontend-work/fetch/licenses --bundle-only \
            --output frontend-work/bundle 2>&1 | tee frontend-work/logs/bundle.log
          # Show which payload (executable or GMP) sets the glibc floor.
          for elf in frontend-work/bundle/bin/*; do
            echo "$elf"
            readelf -d -V "$elf"
          done 2>&1 | tee frontend-work/logs/bundled-elf.log
      - name: Audit or validate and tag manylinux 2.28
        id: tag
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        run: |
          set -euxo pipefail
          python frontend/tag-wheel.py frontend-work/wheels/curry_frontend-${FRONTEND_VERSION}.post*-py3-none-*.whl \
            --info frontend-work/wheels/build-info.json \
            --output frontend-work/dist 2>&1 | tee frontend-work/logs/auditwheel.log
      - name: Install wheel offline and test its console script
        id: smoke
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        run: |
          set -euxo pipefail
          exec > >(tee frontend-work/logs/wheel-smoke.log) 2>&1
          python -m venv frontend-work/smoke
          # The original Linux wheel remains usable if a stricter tag failed.
          frontend-work/smoke/bin/python -m pip install --no-index --no-deps \
            frontend-work/wheels/curry_frontend-${FRONTEND_VERSION}.post*-py3-none-linux_*.whl
          test "$(timeout 30 frontend-work/smoke/bin/curry-frontend --numeric-version)" = "$FRONTEND_VERSION"
          timeout 30 frontend-work/smoke/bin/curry-frontend --version
      - name: Stage Sprite using the source-built front end
        id: stage
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          set -euxo pipefail
          cmake -S . -B object-root/cmake -G Ninja \
            -DPython_EXECUTABLE="$(command -v python)" \
            -DWITH_PAKCS= -DWITH_ICURRY= \
            -DWITH_CURRY_FRONTEND="$PWD/frontend-work/build/curry-frontend" \
            2>&1 | tee frontend-work/logs/cmake.log
          make stage 2>&1 | tee frontend-work/logs/stage.log
      - name: Byte parity with the versioned PAKCS references
        id: parity
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: |
          set -euxo pipefail
          install/bin/python frontend/parity.py \
            --binary frontend-work/build/curry-frontend \
            --baseline frontend/reference --output frontend-work/parity \
            2>&1 | tee frontend-work/logs/parity.log
      - name: Render conda recipe if conda-build is available
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        run: |
          set -euxo pipefail
          exec > >(tee frontend-work/logs/conda-render.log) 2>&1
          export SPRITE_FRONTEND_VERSION="$FRONTEND_VERSION"
          export SPRITE_FRONTEND_ARTIFACT="$PWD/frontend-work/bundle"
          if command -v conda >/dev/null && conda render --help >/dev/null 2>&1; then
            conda render conda/curry-frontend
          else
            echo 'conda-build is unavailable; no conda build was attempted.'
          fi
      - name: Write the entry outcome
        if: always()
        env:
          FETCH: ${{ steps.fetch.outcome }}
          TOOLCHAIN: ${{ steps.toolchain.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          WHEEL: ${{ steps.wheel.outcome }}
          TAG: ${{ steps.tag.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          STAGE: ${{ steps.stage.outcome }}
          PARITY: ${{ steps.parity.outcome }}
        run: |
          mkdir -p frontend-work
          printf 'fetch=%s\ntoolchain=%s\nbuild=%s\nwheel=%s\ntag=%s\nsmoke=%s\nstage=%s\nparity=%s\n' \
            "$FETCH" "$TOOLCHAIN" "$COMPILE" "$WHEEL" "$TAG" "$SMOKE" "$STAGE" "$PARITY" \
            | tee frontend-work/outcome.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Collect ghcup, Stack, and Cabal logs even after failure
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p frontend-work/logs
          python frontend/collect-logs.py --source frontend-work/fetch/source \
            --output frontend-work/logs/haskell \
            2>&1 | tee frontend-work/logs/collect-haskell.log
      - name: Upload source, logs, binary, wheels, and both sides of parity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Keep 3.1.0 out of wheels.yml's default frontend-* selection.
          name: ${{ matrix.version == '2.0.0' && 'frontend' || 'curry-frontend' }}-${{ matrix.version }}-${{ matrix.name }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            frontend-work/logs/
            frontend-work/outcome.txt
            frontend-work/fetch/
            frontend-work/ghcup-bootstrap.sh
            frontend-work/build/
            frontend-work/bundle/
            frontend-work/wheels/
            frontend-work/dist/
            frontend-work/parity/
            frontend-work/logs/cmake.log
            !frontend-work/fetch/source/.stack-work/**
            !frontend-work/fetch/source/dist-newstyle/**

  # macOS (issue #162, step 3): the same build on the two architectures of
  # the GitHub runners, without a container.  GHC, Cabal and, for 3.1.0,
  # Stack come from ghcup into the work directory, GMP from Homebrew,
  # vendored beside the executable with @loader_path (frontend/package.py),
  # and the wheel takes the tag of the floor of its files, the macOS of the
  # Homebrew bottle of GMP (frontend/tag-wheel.py).  The steps are those of
  # the Linux job, auditwheel aside; parity runs on both architectures.  The
  # 2.0.0 entries keep the artifact name frontend-macos-*; the 3.1.0 entries
  # take curry-frontend-3.1.0-*, the prefix of the Linux 3.1.0 artifacts, so
  # that the release workflow collects the four wheels of 3.1.0 together.
  macos:
    name: build (${{ matrix.version }}, ${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            runner: macos-15
            version: '2.0.0'
            experimental: false
          - name: macos-x86_64
            runner: macos-15-intel
            version: '2.0.0'
            experimental: false
          - name: macos-arm64
            runner: macos-15
            version: '3.1.0'
            experimental: true
          - name: macos-x86_64
            runner: macos-15-intel
            version: '3.1.0'
            experimental: true
    defaults:
      run:
        shell: bash
    env:
      LC_ALL: C.UTF-8
      # GHC 9.6.7 builds 2.0.0 with the five patches; 3.1.0 builds with
      # GHC 9.8.4 through Stack and the resolver of its source, as on Linux.
      GHC_VERSION: ${{ matrix.version == '3.1.0' && '9.8.4' || '9.6.7' }}
      CABAL_VERSION: '3.10.3.0'
      STACK_VERSION: '2.15.7'
      CABAL_DIR: ${{ github.workspace }}/frontend-work/home/.cabal
      STACK_ROOT: ${{ github.workspace }}/frontend-work/home/.stack
      GHCUP_INSTALL_BASE_PREFIX: ${{ github.workspace }}/frontend-work/home
      SPRITE_CACHE_FILE: ''
      SPRITE_PRODUCT_CACHE: ''
      SPRITE_CURRY2ICURRY: frontend
      FRONTEND_VERSION: ${{ matrix.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # GMP for the front end; GNU coreutils and GNU make for the stage of
      # Sprite, as the macOS job of ci.yml installs them.
      - name: Runner and system dependencies
        run: |
          set -euxo pipefail
          mkdir -p frontend-work/logs "$CABAL_DIR" "$STACK_ROOT" "$GHCUP_INSTALL_BASE_PREFIX"
          exec > >(tee frontend-work/logs/runner.log) 2>&1
          uname -a
          sw_vers
          xcode-select -p
          python --version
          brew install gmp coreutils make
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "$GITHUB_PATH"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          brew --prefix gmp
          ls -l "$(brew --prefix gmp)/lib"
          python -m pip install --verbose 'setuptools>=68' wheel numpy cmake ninja scikit-build-core
          python -m pip list
          cc --version
          ld -v
      - name: Fetch and inspect source, separately from compilation
        id: fetch
        env:
          SOURCE_URL: ${{ inputs.source_url }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
        run: |
          set -euxo pipefail
          args=(--version "$FRONTEND_VERSION")
          if [ -n "$SOURCE_URL$SOURCE_SHA256" ]; then
            args+=(--url "$SOURCE_URL" --sha256 "$SOURCE_SHA256")
          fi
          python frontend/fetch.py --output frontend-work/fetch "${args[@]}" \
            2>&1 | tee frontend-work/logs/fetch.log
      - name: Set up the target Haskell toolchain
        id: toolchain
        run: |
          set -euxo pipefail
          exec > >(tee frontend-work/logs/toolchain.log) 2>&1
          export BOOTSTRAP_HASKELL_NONINTERACTIVE=1
          export BOOTSTRAP_HASKELL_MINIMAL=1
          export BOOTSTRAP_HASKELL_ADJUST_BASHRC=0
          curl --fail --location --retry 3 https://get-ghcup.haskell.org \
            --output frontend-work/ghcup-bootstrap.sh
          shasum -a 256 frontend-work/ghcup-bootstrap.sh
          bash frontend-work/ghcup-bootstrap.sh
          export PATH="$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin:$PATH"
          echo "$GHCUP_INSTALL_BASE_PREFIX/.ghcup/bin" >> "$GITHUB_PATH"
          ghcup --version
          ghcup --verbose install ghc "$GHC_VERSION"
          ghcup set ghc "$GHC_VERSION"
          ghcup --verbose install cabal "$CABAL_VERSION"
          ghcup set cabal "$CABAL_VERSION"
          if [ "$FRONTEND_VERSION" = 3.1.0 ]; then
            ghcup --verbose install stack "$STACK_VERSION"
            ghcup set stack "$STACK_VERSION"
            stack --version
          fi
          for tool in ghc ghc-pkg cabal; do
            command -v "$tool"
            "$tool" --version
          done
          test "$(ghc --numeric-version)" = "$GHC_VERSION"
          test "$(cabal --numeric-version)" = "$CABAL_VERSION"
      - name: Build the selected version with the system libraries of macOS and the GMP of Homebrew
        id: compile
        run: |
          set -euxo pipefail
          bash frontend/build.sh frontend-work/fetch/source frontend-work/build "$FRONTEND_VERSION" \
            2>&1 | tee frontend-work/logs/build.log
      - name: Bundle the executable and build a platform wheel
        id: wheel
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          set -euxo pipefail
          python frontend/package.py --binary frontend-work/build/curry-frontend \
            --licenses frontend-work/fetch/licenses --output frontend-work/wheels \
            2>&1 | tee frontend-work/logs/wheel.log
          python frontend/package.py --binary frontend-work/build/curry-frontend \
            --licenses frontend-work/fetch/licenses --bundle-only \
            --output frontend-work/bundle 2>&1 | tee frontend-work/logs/bundle.log
          # The load commands of the payload: the floor of each file and the
          # libraries it names.
          for file in frontend-work/bundle/bin/*; do
            echo "$file"
            otool -L "$file"
            otool -l "$file" | grep -A 4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' || true
          done 2>&1 | tee frontend-work/logs/bundled-macho.log
      - name: Tag the wheel with the macOS floor of its files
        id: tag
        if: ${{ !cancelled() && steps.wheel.outcome == 'success' }}
        run: |
          set -euxo pipefail
          python frontend/tag-wheel.py frontend-work/wheels/curry_frontend-${FRONTEND_VERSION}.post*-py3-none-*.whl \
            --info frontend-work/wheels/build-info.json \
            --output frontend-work/dist 2>&1 | tee frontend-work/logs/tag.log
          ls -l frontend-work/dist
      - name: Install wheel offline and test its console script
        id: smoke
        if: ${{ !cancelled() && steps.tag.outcome == 'success' }}
        run: |
          set -euxo pipefail
          exec > >(tee frontend-work/logs/wheel-smoke.log) 2>&1
          python -m venv frontend-work/smoke
          frontend-work/smoke/bin/python -m pip install --no-index --no-deps \
            frontend-work/dist/curry_frontend-${FRONTEND_VERSION}.post*-py3-none-macosx_*.whl
          test "$(frontend-work/smoke/bin/curry-frontend --numeric-version)" = "$FRONTEND_VERSION"
          frontend-work/smoke/bin/curry-frontend --version
      - name: Stage Sprite using the source-built front end
        id: stage
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        run: |
          set -euxo pipefail
          cmake -S . -B object-root/cmake -G Ninja \
            -DPython_EXECUTABLE="$(command -v python)" \
            -DWITH_PAKCS= -DWITH_ICURRY= \
            -DWITH_CURRY_FRONTEND="$PWD/frontend-work/build/curry-frontend" \
            2>&1 | tee frontend-work/logs/cmake.log
          make stage 2>&1 | tee frontend-work/logs/stage.log
      - name: Byte parity with the versioned PAKCS references
        id: parity
        if: ${{ !cancelled() && steps.stage.outcome == 'success' }}
        run: |
          set -euxo pipefail
          install/bin/python frontend/parity.py \
            --binary frontend-work/build/curry-frontend \
            --baseline frontend/reference --output frontend-work/parity \
            2>&1 | tee frontend-work/logs/parity.log
      - name: Write the entry outcome
        if: always()
        env:
          FETCH: ${{ steps.fetch.outcome }}
          TOOLCHAIN: ${{ steps.toolchain.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          WHEEL: ${{ steps.wheel.outcome }}
          TAG: ${{ steps.tag.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          STAGE: ${{ steps.stage.outcome }}
          PARITY: ${{ steps.parity.outcome }}
        run: |
          mkdir -p frontend-work
          printf 'fetch=%s\ntoolchain=%s\nbuild=%s\nwheel=%s\ntag=%s\nsmoke=%s\nstage=%s\nparity=%s\n' \
            "$FETCH" "$TOOLCHAIN" "$COMPILE" "$WHEEL" "$TAG" "$SMOKE" "$STAGE" "$PARITY" \
            | tee frontend-work/outcome.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Collect ghcup, Stack, and Cabal logs even after failure
        if: always()
        run: |
          set -euxo pipefail
          mkdir -p frontend-work/logs
          python frontend/collect-logs.py --source frontend-work/fetch/source \
            --output frontend-work/logs/haskell \
            2>&1 | tee frontend-work/logs/collect-haskell.log
      - name: Upload source, logs, binary, wheels, and both sides of parity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.version == '2.0.0' && format('frontend-{0}', matrix.name) || format('curry-frontend-{0}-{1}', matrix.version, matrix.name) }}-${{ github.run_attempt }}
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            frontend-work/logs/
            frontend-work/outcome.txt
            frontend-work/fetch/
            frontend-work/ghcup-bootstrap.sh
            frontend-work/build/
            frontend-work/bundle/
            frontend-work/wheels/
            frontend-work/dist/
            frontend-work/parity/
            !frontend-work/fetch/source/dist-newstyle/**
            !frontend-work/fetch/source/.stack-work/**
