[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "currylang-frontend"
version = "2.0.0.post4"
description = "The Curry to FlatCurry front end shipped with PAKCS 3.4.1"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}

[project.scripts]
curry-frontend = "curry_frontend:main"

[tool.setuptools]
packages = ["curry_frontend"]
license-files = ["licenses/*"]

[tool.setuptools.package-data]
curry_frontend = ["bin/*", "licenses/*", "build-info.json"]
