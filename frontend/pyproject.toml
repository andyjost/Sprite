[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
authors = [{name = "Andy Jost"}]
name = "curry-frontend"
# setup.py selects 2.0.0.post6 (default) or 3.1.0.post1.
dynamic = ["version"]
description = "The Curry to FlatCurry front end shipped with PAKCS 3.4.1 or 3.10.0"
readme = "README.pypi.md"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}

[project.scripts]
curry-frontend = "curry_frontend:main"

[tool.setuptools]
packages = ["curry_frontend"]
license-files = ["licenses/*"]

[tool.setuptools.package-data]
curry_frontend = ["bin/*", "licenses/*", "build-info.json"]
