[build-system]
requires = ["scikit-build-core>=1.1", "cmake>=3.24", "ninja"]
build-backend = "scikit_build_core.build"

[project]
authors = [{name = "Andy Jost"}]
name = "curry"
dynamic = ["version"]
description = "The Sprite compiler and runtime for Curry"
readme = "README.pypi.md"
requires-python = ">=3.11.4"
# llvmlite brings the LLVM backend of the JIT (the flag jit; issue #65),
# about 60 MB per wheel; it has no wheel for Intel macOS, where conda-forge
# provides it and the C++ compiler backend serves otherwise.
dependencies = [
  "curry-frontend>=3.1.0",
  "llvmlite>=0.50; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
license = "BSD-3-Clause"
license-files = ["LICENSE", "curry/lib/LICENSE", "curry/lib/NOTICE", "extern/pybind11/LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: C++",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
]

[project.optional-dependencies]
# An alias from the releases before llvmlite was a dependency: curry[jit]
# installs the same package, on Intel macOS too, where pip then has no wheel.
jit = ["llvmlite>=0.50"]

[project.urls]
Homepage = "https://github.com/andyjost/Sprite"
Documentation = "https://andyjost.github.io/Sprite/"
Source = "https://github.com/andyjost/Sprite"
Issues = "https://github.com/andyjost/Sprite/issues"

[project.scripts]
sprite-exec = "curry.tools.entrypoints:execute"
sprite-make = "curry.tools.entrypoints:make"

[[tool.dynamic-metadata]]
field = "version"
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = '(?P<value>\S+)'

[tool.scikit-build]
cmake.version = ">=3.24"
wheel.packages = []
sdist.include = [
  "extern/pybind11/include/**",
  "extern/pybind11/tools/**",
  "extern/pybind11/CMakeLists.txt",
  "extern/pybind11/LICENSE",
  "extern/libtommath/bn_*.c",
  "extern/libtommath/*.h",
  "extern/libtommath/LICENSE",
  "curry/lib/**/.curry/sprite-pakcs-3.10.0/*.icy",
  "curry/lib/**/.curry/sprite-pakcs-3.10.0/*.fint",
  "curry/lib/**/.curry/sprite-pakcs-3.10.0/*.icurry",
  "curry/lib/**/.curry/sprite-pakcs-3.10.0/*.icy.imports",
  "curry/lib/**/.curry/sprite-pakcs-3.10.0/*.icy.source",
]
sdist.exclude = ["CODEX-REPORT.md", "assets/**"]
